<style>
/* Layout: a bound codex on deep indigo. Index left (a select on phones), entries right. Each entry can switch between the forms it takes. */
:root{
  --ink:#110b2e; --vellum:#1b1442; --well:#160f38; --bone:#e7dcc6; --dim:#a69dc9; --gilt:#c9a45c; --rule:#3b3175;
  --display:"IM Fell English SC","IM Fell English",Georgia,serif;
  --body:"Spectral",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
html,body{background:var(--ink);color:var(--bone)}
body{font-family:var(--body);font-size:16.5px;line-height:1.62;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
header{max-width:1240px;margin:0 auto 18px;display:flex;flex-wrap:wrap;gap:6px 24px;align-items:baseline;justify-content:space-between}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,4.4vw,42px);letter-spacing:.02em;margin:0;color:var(--gilt);text-wrap:balance}
.sub{color:var(--dim);font-style:italic;margin:4px 0 0;max-width:64ch;flex-basis:100%}
.other{font-size:14px;color:var(--gilt);text-decoration:none;border-bottom:1px solid var(--rule)}
.other:hover,.other:focus-visible{color:var(--bone);border-color:var(--gilt);outline:none}
.wrap{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}}
nav.index{position:sticky;top:max(12px,env(safe-area-inset-top,0px));max-height:calc(100vh - 24px);overflow:auto;border:1px solid var(--rule);background:var(--well);padding:12px 14px 16px;border-radius:2px}
@media (max-width:860px){nav.index{display:none}}
nav.index h2{font-family:var(--display);font-weight:400;font-size:15px;letter-spacing:.08em;color:var(--dim);margin:14px 0 4px}
nav.index h2:first-child{margin-top:2px}
nav.index ul{list-style:none;margin:0;padding:0}
nav.index a{display:block;padding:3px 6px;color:var(--bone);text-decoration:none;font-size:15px;border-left:2px solid transparent}
nav.index a:hover,nav.index a:focus-visible{color:var(--gilt);border-color:var(--gilt);outline:none}
nav.index a.cur{color:var(--gilt);border-color:var(--gilt)}
.tools{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin:0 0 18px}
.tools input,.tools select{font-family:var(--body);font-size:15px;background:var(--vellum);color:var(--bone);border:1px solid var(--rule);padding:7px 10px;border-radius:2px;min-width:0}
.tools input{flex:1 1 220px}
.tools input:focus-visible,.tools select:focus-visible{outline:1px solid var(--gilt)}
#jump{display:none;flex:1 1 220px}
@media (max-width:860px){#jump{display:block}}
.count{color:var(--dim);font-size:14px}
section.cat>h2{font-family:var(--display);font-weight:400;font-size:21px;letter-spacing:.06em;color:var(--dim);margin:30px 0 10px;border-bottom:1px solid var(--rule);padding-bottom:6px}
section.cat:first-of-type>h2{margin-top:6px}
article{background:var(--vellum);border:1px solid var(--rule);border-radius:2px;padding:20px 22px 18px;margin:0 0 16px;scroll-margin-top:14px}
article:target{border-color:var(--gilt)}
article h3{font-family:var(--display);font-weight:400;font-size:clamp(23px,3vw,28px);color:var(--gilt);margin:0;text-wrap:balance}
.meta{font-size:13.5px;color:var(--dim);letter-spacing:.03em;margin:2px 0 8px}
.lead{font-style:italic;color:var(--bone);opacity:.92;margin:0 0 12px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.tabs button{font-family:var(--body);font-size:14px;background:transparent;color:var(--dim);border:1px solid var(--rule);padding:4px 11px;border-radius:14px;cursor:pointer}
.tabs button:hover,.tabs button:focus-visible{color:var(--bone);border-color:var(--gilt);outline:none}
.tabs button[aria-selected="true"]{color:var(--ink);background:var(--gilt);border-color:var(--gilt)}
.form h4{font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:.04em;margin:0 0 4px;color:var(--bone)}
.form h4 span{font-family:var(--body);font-size:13px;color:var(--dim);letter-spacing:.02em;margin-left:8px}
.form p{margin:0 0 10px;max-width:72ch}
.note{border-left:2px dotted var(--gilt);padding-left:10px;color:var(--gilt);font-style:italic;margin:10px 0 0;max-width:72ch}
.empty{color:var(--dim);font-style:italic}
mark{background:#c9a45c33;color:inherit}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<header>
  <h1>Nous Within Kenoma · Codex of Locations</h1>
  <a class="other" href="codex-beings.html">Codex of Beings →</a>
  <p class="sub">Realms, rooms and the places between, from the Fullness to the trailer hallway. Tap a form to switch between a place’s appearances. Lines marked Note come from the author.</p>
</header>

      <select id="jump" aria-label="Jump to an entry"><option value="">Jump to an entry…</option></select>
      <span class="count" id="count"></span>

</div>

<script>
const CATS=["Beyond the Kenoma", "The outer darkness and its moats", "Limbo", "The heavens of creation", "The Earth", "Rooms, houses and halls", "Visions and other realms"];
const E=[{"id": "full", "name": "The Fullness", "cat": "Beyond the Kenoma", "ch": "4, 17, 19, 20, 21, 23, 31", "lead": "Perfect light, and the home the lost once knew.", "forms": [{"t": "Home", "ch": "4", "x": "The shoreline sermons describe a light that fades at its shore into nothingness, and souls who grow colder “the more it leaves home.” “What ought to be is always being, and of itself is complete light, so those who fall into the deep are not even adjusted to the depths of the ever-death.” If the lost had known the truth, they would know “a place called home.”"}, {"t": "Above", "ch": "17, 19, 20, 21, 23, 31", "x": "“The fullness will unleash your own kind upon you” (17). At the portal, “emptiness and fullness meet” (19). Samson stands “before the orders from the fullness”; Antony casts out Satan “by the power of the fullness,” and the judgement on Leviathan is “a command of the fullness above” (20). Leviathan's “only match is the fullness I fell from with purpose” (21). “In nothingness is anything but fullness” (23). Wisdom of Limbo says, “my duty is unto the fullness” (31)."}], "notes": ["Note: the Fullness is pure and perfect, without flaw or suffering, and the nameless one belongs to it. It does not surround the Kenoma; it sits above it as a ball of white light.", "Note: unofficially, Sophia comes from the Fullness."]}, {"id": "kenoma", "name": "The Kenoma", "cat": "Beyond the Kenoma", "ch": "17, 20, 21, 23", "lead": "The emptiness: everything below the Fullness.", "forms": [{"t": "Cold under a blanket of stars", "ch": "17", "x": "The chapter named for it begins in a bed: you pull the sheets until the walls come down with them, wrap yourself in the ceiling, then in the stars and the dark of the night sky. “Cold, no matter how thick the blanket is. You can't escape the pain. You have to wake up.” Hungry, you eat the stars and their planets, then yourself, and repeat."}, {"t": "Named", "ch": "20, 21, 23", "x": "Leviathan roams “the outer darkness of the Kenoma” (20). A truthless saying “echoes throughout the Kenoma” (21). Souls are fed into Leviathan “from a lostness path away, not meant to be found within the Kenoma” (23)."}], "notes": ["The text does not mark where the Kenoma ends."]}, {"id": "outer", "name": "The Outer Darkness", "cat": "The outer darkness and its moats", "ch": "1, 3, 4, 6, 13, 20, 21, 23, 33", "lead": "Outside creation: Leviathan's realm of nothingness.", "forms": [{"t": "Drunk on poisons", "ch": "1, 3, 4, 13", "x": "“That outer darkness, drunk on bridling poisons / Torturing who I am with stirnament / Eternal” (1). Quiet doors knock, “hinting of its confinement to the outer darkness, find help” (3). The demons, “these tortured ones rule the outer darkness,” and the Devil God was cast into it (4). Souls are “taken to the outer darkness and punished by vile drunkenness and stupor” (13)."}, {"t": "Leviathan's realm", "ch": "20, 21", "x": "After his death, Leviathan rules it, “granting a spiritual prison beyond even the realm of the demiurge”; it “encircles even the heavens and the skies, ensnaring all of creation deeper with newfound evil” (20). “The outer darkness is the bastardization of all living, where they march in confusion that nous-rots with eternal tyranny … a mockery of the demiurge's creation” (21)."}, {"t": "The playground stairs", "ch": "20", "x": "Puppets march on “stairs that defy gravity, in every direction, on every axis, in the colors of a children's playground,” leading nowhere but themselves. A light shines through it, “darker than Leviathan's eyes, and it is made of the outer darkness.”"}, {"t": "The hotel of puppet machines", "ch": "23", "x": "A vast yellow-lit room with brown walls and carpet where marionettes torment Satan. “Where Satan lies is just one little room of this infinitude hotel of puppet machines. Stairs all leading into each other, always making new stairs, where steps hold rooms inside of rooms.” Time there is counted with the Number, a one followed by ten billion zeros raised to itself again and again, and even that is only a yardstick."}, {"t": "Inside and outside", "ch": "6, 33", "x": "“Welcome to this outer darkness from inside the boy” (6). The spirit of life roams “even outside the outer darkness” (33)."}], "notes": ["Note: outside creation, made of the shadow of Leviathan. The puppets and stairs live inside it. The three moats are three of its darknesses."]}, {"id": "moat3", "name": "The Third Moat: the Outermost Darkness", "cat": "The outer darkness and its moats", "ch": "3, 4, 21, 31, 33", "lead": "The last ring of darkness around creation.", "forms": [{"t": "The shore", "ch": "3, 4", "x": "“The shore is always stretching, always reaching further into the abyss, into the blindness of the outer darkness. It is eternally void” (4). A voice lies “dead at the bottom of this shore of the abyss, on the cusp of nothingness” (3)."}, {"t": "The nothingness moat", "ch": "21, 31, 33", "x": "Leviathan is “given keys of providence in this nothingness moat, which the demiurge will stumble into three times” (21). Wisdom tells Samson his love “could be found within yourself, within the outermost realm of the outer—darkness” (31). Fleeing the spirit, the Yaldabaoth trips “into the outermost moat of the outer darkness” and finds “only the nothingness swallowing his imperfect flame” (33)."}], "notes": ["Note: the third moat, around creation, is the outermost darkness."]}, {"id": "moat2", "name": "The Second Moat: the Tar", "cat": "The outer darkness and its moats", "ch": "36", "lead": "A black abyss twice as long as the first.", "forms": [{"t": "Where the Sun was lost", "ch": "36", "x": "Never having seen it, Yaldabaoth wonders how to pass “twice as long as the last.” He tears the Sun from the sky and throws it into “the abyssal moat,” hoping to see. The dark devours the light, the Sun sinks into the black tar, and the quicksand of dark pulls him down after it, face first, “like a child drowning in the pool of oil.” Lucifer lifts him out with a ladder of a word, but “the sun is missing and left behind.”"}], "notes": []}, {"id": "titans", "name": "The Titans' Watch", "cat": "The outer darkness and its moats", "ch": "36", "lead": "Where the three titans stood.", "forms": [{"t": "Through the first moat", "ch": "36", "x": "“It is through the first moat that he finds towering titans of eyes,” three of them, covered in seven hundred and seventy-seven eyes, who watch his pride. His shadow swallows them there."}], "notes": []}, {"id": "moat1", "name": "The First Moat: the Scalding River", "cat": "The outer darkness and its moats", "ch": "21, 33, 36", "lead": "The river of dying memories.", "forms": [{"t": "The river", "ch": "36", "x": "“The river of dying memories caustically scalds, splitting the skin into peels of cuticles.” It is “cauldrous with thick tar boils, their substance being the decay of reminiscence.” The demons call it “the burning black sludge liquid of withering remembrance.” Yaldabaoth crosses it on a bridge of his own bound angels."}, {"t": "By the first moat", "ch": "21, 33", "x": "Leviathan sweeps down “from the moat of the hell beyond” (21). Saturn is “resonant in sickness by the first moat, and its rings, like the first encircling darkness around creation,” hide on the seventh day (33)."}], "notes": ["Note: Limbo lies between the first moat and creation."]}, {"id": "limbo", "name": "Limbo", "cat": "Limbo", "ch": "3, 18, 26, 30, 31, 33", "lead": "The realm of neither living nor dead.", "forms": [{"t": "Between", "ch": "26, 30", "x": "The Fool calls his home “in between the unreal realms of the material and the nothingness … Of spirit beyond!” (26), and “the land of neither dead nor living” (30)."}, {"t": "Named", "ch": "3, 18, 31, 33", "x": "“Fading births and fathomless limbo” (3). “Spit revelation's limbo back into the cup of sand” (18). Wisdom is “of the first of third Limbo” (31). The spirit of life roams “outside the limbo” (33)."}], "notes": ["Note: the layers of Limbo lie between the first moat and creation. Their order on the map follows Samson's walk; the text does not say which way is outward."]}, {"id": "limbo1", "name": "The Fool's Realm", "cat": "Limbo", "ch": "26, 35", "lead": "Green fields under a black sky, and the tree of neither life nor death.", "forms": [{"t": "Tree IV", "ch": "26", "x": "Short, thick dark-green grass; a path curving left and right from one horizon to its opposite; a blank sky, “no stars, just black,” with no sun or moon. A single long, thick, dry-brown dead tree stands there, the Fool's first tree, “given by God.” Samson enters from the south of route zero and takes the only exit, to the north, after chopping the tree down."}, {"t": "Painted", "ch": "35", "x": "Alice Love's painting shows the jester on an old tree, “an endless field of green with a path cutting through it, like the slithering movement of a large snake gone North,” beneath “that most pure black.”"}], "notes": []}, {"id": "circus", "name": "The Circus Tent", "cat": "Limbo", "ch": "30", "lead": "Beneath a rabbit hole, the Fool's circus.", "forms": [{"t": "Toll of a Tree: Death!", "ch": "30", "x": "Down a tunnel of roots and dry dirt lies a drooping black, white and red circus tent, lit by swirling lights of every color in fast breaths. Puppets fill tiers of benches; puppet musicians mimic false music while an accordion plays true. The Fool descends on a fish hook. Hearts are thrown, and the goat-headed bull tramples Alice there."}], "notes": []}, {"id": "limbo2", "name": "The Gate of the Black Joker", "cat": "Limbo", "ch": "29", "lead": "A pond, a fountain and a guarded gate.", "forms": [{"t": "The arcadium", "ch": "29", "x": "Past the green flats, rich soil covered in thick bristles, “within the plentiful arcadium.” Lotus flowers drift across a pond with a fountain at its middle; the black sky above is not reflected in the water; a blue and golden glow conjures from the ground in cycles. A tall wooden gate is guarded by the goat-bull devil, its padlock printed “black joker.” From the water Samson pulls a spine that becomes a spear."}], "notes": []}, {"id": "limbo3", "name": "The Graveyard Crossroad", "cat": "Limbo", "ch": "31", "lead": "A graveyard of fog, and the tree of both life and death.", "forms": [{"t": "Tree III", "ch": "31", "x": "Howls whistle through the teeth of skulls; bones tick in walls of bone. Fog lies over grey-purple ground, stones run to a dark blue-purple horizon, and dead trees rot under mycelium. Only the hangman's tree lives: the tree of both life and death, “always withering without loss,” the form of transformation. It is a crossroad of four forms (life, death, both, none) and four ends (eternal life, eternal nothingness, both, none)."}], "notes": []}, {"id": "heaven", "name": "The Heaven of the Demiurge", "cat": "The heavens of creation", "ch": "10, 11, 13, 36", "lead": "The land of memories.", "forms": [{"t": "Land of memory forms", "ch": "10", "x": "Antony pulls himself up “into the land of memory forms; a part of this fake heaven,” and stands “in swirls of delusion lands without ground.” The dragged serpent leaves road burns across “the puppet master's home, staining his memories.”"}, {"t": "Land of memories", "ch": "13, 36", "x": "God casts his followers “deeper into the land of memories” (13). After the moats, Yaldabaoth swims up through the firmament, “finding his land of memories restful,” breathes out the star Redemption there, and casts Curse out of it (36)."}, {"t": "An echo", "ch": "11", "x": "Not named as the heaven: the dark one tells Thomas, “You found yourself in the land of delusion, made of memories forgetting themselves and of themselves.”"}], "notes": ["Note: the heaven is made of memories of itself and lies beyond the stars."]}, {"id": "stars", "name": "The Archons' Stars", "cat": "The heavens of creation", "ch": "10, 17, 18, 22", "lead": "Where the true angels hang.", "forms": [{"t": "The star-stricken dome", "ch": "10", "x": "“Stars: shining chaos of infinite points, mad with the curse of the prison ruse.” Angels hang from them by the spine while ancients dance in masks around fires below."}, {"t": "A blanket", "ch": "17, 18, 22", "x": "In chapter 17 you bend the stars down and wrap yourself in them, then eat them. “Swirling star domes wrapping you warmly, cooking you alchemically” (18). The night sewing of clouds whispers numbers felt by ten epinoias (22)."}], "notes": []}, {"id": "planets", "name": "The Planets", "cat": "The heavens of creation", "ch": "3, 4, 11, 16, 18, 20, 22, 31, 33, 39", "lead": "The old spheres around the Earth, with Neptune beyond.", "forms": [{"t": "Saturn", "ch": "11, 22, 33", "x": "Saturn squares off with Mars and Neptune at Thomas's burial (11), is revealed in conjunction with Jupiter behind the moon (22), and is “resonant in sickness by the first moat,” its rings hidden on the seventh day “as homage, honouring the suffering of its God” (33)."}, {"t": "Jupiter", "ch": "4, 22", "x": "“A serpent of a side from Jupiter never ending in light” (4). In conjunction with Saturn, opposite Venus, Mars and the Sun (22)."}, {"t": "Mars", "ch": "16, 20, 22, 31", "x": "“The stinging of Mars' eyes” (16); “a now-dead Mars look” (20); “a waking God made of Mars” (31)."}, {"t": "Venus", "ch": "3, 16, 22", "x": "“Where Venus begins again” (3); Kether as “a rising morning Venus” (16)."}, {"t": "Mercury", "ch": "18", "x": "“The soul speaks like Mercury of the skies and alchemy.”"}, {"t": "Neptune", "ch": "11, 18, 39", "x": "“A dissolve of Neptune's conjunction” (18); “sapphiric neptune haze” in the sky of two suns (39)."}], "notes": ["Note: Neptune is placed beyond Saturn."]}, {"id": "sun", "name": "The Sun", "cat": "The heavens of creation", "ch": "11, 22, 36", "lead": "The first Sun, lost, and the second Sun.", "forms": [{"t": "The first Sun", "ch": "36", "x": "Torn out of the sky by Yaldabaoth, it scorches his claws and begs, “My will is to be let free!” then yields. It sinks into the tar of the second moat and stays there."}, {"t": "The second Sun", "ch": "36", "x": "Yaldabaoth swims through the dark night sky “and he spits out a new sun, the second Sun of creation, looking just the same as before.”"}, {"t": "Shot down", "ch": "11, 22", "x": "In Thomas's storm, the sun falls “shot down by an Archon's fired betrayal” (11). Opposed to Saturn and Jupiter (22)."}], "notes": []}, {"id": "moon", "name": "The Moon", "cat": "The heavens of creation", "ch": "2, 17, 18, 19, 22, 36", "lead": "A stepping stool for the weaver, and a perch for a snake.", "forms": [{"t": "The weaver's moon", "ch": "19, 36", "x": "The moon is a stepping stool for the shadow woman who weaves clouds with crab claws (19). Words are sewn from it into Yaldabaoth's sanity, “and the Moon says the same” (36)."}, {"t": "The snake's moon", "ch": "17, 18", "x": "“Your snake son of moon” (17). “Leviathan as Snake on the moon,” constricting a shadow above the desert (18)."}, {"t": "Knocked from the sky", "ch": "22", "x": "Leviathan knocks the full moon out of the sky, revealing Saturn and Jupiter behind it."}, {"t": "Crescent", "ch": "2, 19", "x": "“Under a dark crescent” (2). A thin daylight crescent hangs over the tree of death (19)."}], "notes": []}, {"id": "earth", "name": "The Earth", "cat": "The Earth", "ch": "1, 4, 13, 16, 36", "lead": "The material plane: the dead home.", "forms": [{"t": "The dead home", "ch": "1, 4, 13", "x": "“You're in a dead home, a dead curtain, go back” (1). The Devil God's dying memory “spews forth corruption onto the material plane you have left, this being his creation … your dream, your dead home” (4). A raging God covers the lands “into sickening rot of material bondage” (13)."}, {"t": "The island", "ch": "16", "x": "The Euclids live on an island: the South mountains of Binah and the stony North mountains of Tiphareth."}, {"t": "Cast down", "ch": "36", "x": "Curse falls into “the dirt of humankind” like a meteor, and Lucifer and Ouroboros are cast down into the Earth together."}], "notes": ["Note: a plane of existence, not necessarily a sphere, with the planets and the Sun around it as in old cosmology."]}, {"id": "tartarus", "name": "Tartarus", "cat": "The Earth", "ch": "19, 20", "lead": "A prison in the ocean.", "forms": [{"t": "A nightmare within nightmares", "ch": "19, 20", "x": "Antony is “the only angel to have been there and come back,” and calls it “a nightmare within nightmares, though dreadfully aware, even inside it, of its foreboding falsehood” (19). Leviathan “held the keys to his Tartarus prison” (20), and “Tartarus will celebrate this castration of the dark oceans” (19)."}], "notes": ["Note: placed in the ocean."]}, {"id": "ocean", "name": "Leviathan's Ocean and the North Shore", "cat": "The Earth", "ch": "10, 19, 20", "lead": "The sea that held the serpent.", "forms": [{"t": "The ocean", "ch": "10, 19", "x": "Antony's head falls “into a booming splash … into the abyss of Leviathan's ocean” (10). “From the oceans they pulled another, this one missing its wings” (19)."}, {"t": "The north shore", "ch": "20", "x": "A cliff's edge above clouded oceans and a shore of sand. The sea spins into a whirlpool as the serpent rises; the battle ends with Samson's armor ploughed into the wet sand and the ocean “a floor of red and black.”"}], "notes": []}, {"id": "cave", "name": "The Cave of Forgotten Machines", "cat": "The Earth", "ch": "19", "lead": "Where Samson's new heart was made.", "forms": [{"t": "The hoard", "ch": "19", "x": "Behind gates in the Southern mountains, a black cave lit only by goggle lamps: brass gyroscopes gone green, a dusty tube-screen, a horned phonograph, bent antennas, a cracked orrery, a hundred disagreeing clocks, and crystal lodges “waiting like cups for a drink.” On a stone slab hollowed by the weight of others, the Euclids cut out Samson's heart and set Antony in its place."}], "notes": []}, {"id": "mountain", "name": "The Mountain and the Portal", "cat": "The Earth", "ch": "19", "lead": "A tree of death on a cliff, and a portal of dark flame.", "forms": [{"t": "The crimson shroud", "ch": "19", "x": "Climbing by day, Samson and Antony find “a crimson shroud … beneath a tree of death, standing like a tombstone that blotted out the sun.” Its dark flame bursts into a portal that comes “once in twenty years,” and a wind nearly throws Samson from the cliff. Through it, “emptiness and fullness meet,” and he stands under a tree of life glowing like the sun."}], "notes": []}, {"id": "trees", "name": "The Four Trees", "cat": "Visions and other realms", "ch": "19, 22, 26, 31, 32, 33", "lead": "The trees of the four chapters titled Tree.", "forms": [{"t": "Tree IV: Neither Life or Death", "ch": "26, 30", "x": "The Fool's single tree in the green realm; cut down by Samson. Its fall brings “the curse of the joker” (31)."}, {"t": "Tree III: Both Life and Death", "ch": "31", "x": "The hangman's tree in the graveyard, “always withering without loss,” the form of transformation."}, {"t": "Tree II: Death", "ch": "19, 22, 32", "x": "A tree of death under a crimson shroud on the mountain (19). In Kether's hallway, when Satan hangs from the tree, “the tree is no longer life, but death” (22). Chapter 32 bears its name."}, {"t": "Tree I: Life", "ch": "19, 22, 33", "x": "Through the portal, “a tree emanating life like a fountain, glowing like the sun from its heart” (19). A tree grows violently at the end of Kether's hallway, and Antony wrestles Satan “under the tree of life” (22). Chapter 33 bears its name."}], "notes": ["Note: Trees I and II are seen in implied spiritual form in 19 and 22."]}, {"id": "chamber", "name": "The Stone Chamber", "cat": "Rooms, houses and halls", "ch": "5, 32, 34, 37", "lead": "The room of the raised stone, the crucifix and the maiden.", "forms": [{"t": "The angel's room", "ch": "5", "x": "A stone-raised slope with tubes and needles; Antony on a wall crucifix of wires and pumps, blue sparks from the ceiling; and in the corner “the jugged stone maiden of wires, needles, and a mask connected to the large gas tank beside it: the blindfold.”"}, {"t": "Return", "ch": "32, 34", "x": "Kether lies on “the bed of raised stone” full of needles (32). The man wakes on the cold floor before the raised stone, the pumps and the blindfold; lights flicker and old wires spark (34)."}, {"t": "The corridors", "ch": "37", "x": "Large square corridors, almost bare, wires spraying blue and yellow sparks across stone architecture, the air sweet with gas. Alice opens the maiden in the corner and pulls Christopher out."}], "notes": []}, {"id": "yellow", "name": "The Yellow Room and the Brown Carpet", "cat": "Rooms, houses and halls", "ch": "7, 8, 14, 20, 23, 25, 27, 28, 42", "lead": "A yellow light on brown carpet that keeps returning.", "forms": [{"t": "The carpet", "ch": "7, 8, 14", "x": "“There is a soft yellow glow from the closet” (7). “Beneath soft, sick-hued yellows out from lamp shade reminders across brown carpet” (8). The Hermit dies “in the corner of a small room on brown carpet, yellow-hued familiarly, like a million times in a million times familiar” (14)."}, {"t": "The hallway", "ch": "20, 25, 27, 28", "x": "Samson sees “a hallway, yellow, with brown carpet” in his cracked visor (20). Lucifer's voice comes “down a narrow hallway, yellow with forgotten memories” (25). Blows beat “across a yellow lit hallway” (27). “The darkness broken by the yellow from the hall” (28)."}, {"t": "In the outer darkness", "ch": "23", "x": "Satan's room: “the bright yellow and the brown walls of a room vast,” brown carpet fibers, “a lampshade-yellow with brown carpet.”"}, {"t": "The trailer", "ch": "42", "x": "Damon finds “the hue of the yellow bathroom light terrifyingly familiar,” beside brown wallpaper that imitates wood grain."}], "notes": []}, {"id": "kether-hall", "name": "Kether's Hall", "cat": "Rooms, houses and halls", "ch": "16, 22", "lead": "The throne hall and the crimson hallway.", "forms": [{"t": "The throne", "ch": "16", "x": "People of every kind are chained in bondage in the hall before his throne, “used as symbolic decorations.”"}, {"t": "The crimson hallway", "ch": "22", "x": "Behind a tall wooden door, Antony hangs from a wall crucifix. Outside it, the hall turns crimson under a full moon, shadows rise on the walls, a tree bursts up, and Antony fights Satan. At sunrise the window is shattered and the tree is gone."}], "notes": []}, {"id": "towers", "name": "The Monolith Towers", "cat": "Rooms, houses and halls", "ch": "7", "lead": "Towers risen from no ground.", "forms": [{"t": "Rebirth", "ch": "7", "x": "“Our monolith towers we are trapped inside of have always been risen from no ground,” filled “with wires and runes,” with little cubicle shelters watched by wired angels, smog between towering skylines, and rain forever."}], "notes": []}, {"id": "stonehouse", "name": "The House of the Rabbit Mask", "cat": "Rooms, houses and halls", "ch": "6", "lead": "Stone tiles, wasps' nests and a thorned window.", "forms": [{"t": "As Snakes See", "ch": "6", "x": "Stone tiles and stone ceiling; nests and wasps hugging the ceiling and walls; a window where thunder spills in, and at dawn branches with thorned stipes climbing over the glass."}], "notes": []}, {"id": "thomashouse", "name": "Thomas's House and the Red House", "cat": "Rooms, houses and halls", "ch": "11", "lead": "A porch in the rain, and a red house that wasn't there.", "forms": [{"t": "The house", "ch": "11", "x": "A stone porch over hills and rain, a mellotron record, and a warm room with a coffee table of silk covers, dice, rune books and the two dolls."}, {"t": "The red house", "ch": "11", "x": "A small red house that wasn't there, toy-sculpted, plastic and glossy, between two trees with broken bicycles. Inside, a carpetless hallway, a picture of Noidy, no doors, and a descent into a box of mirrors where Thomas loses his body."}], "notes": []}, {"id": "room9", "name": "The Abandoned Room and the Hoard", "cat": "Rooms, houses and halls", "ch": "9, 34", "lead": "Rooms with a pink television.", "forms": [{"t": "Good Puppet", "ch": "9", "x": "An abandoned room with a small window and a carpetless floor, which “looks like thirty years old, like me. My mom used to own this place.” A pink television, a counter, a ringing phone."}, {"t": "Thistle Rope", "ch": "34", "x": "A room of hoarded piles, “four walls of childhood memories replaying,” a chandelier that is “more like a ceiling fan,” a folding chair, a fallen mirror, and a pink television on a dresser."}], "notes": []}, {"id": "alice-room", "name": "Alice's Bedroom", "cat": "Rooms, houses and halls", "ch": "24, 30", "lead": "A second-story room of paintings.", "forms": [{"t": "Hexahedone", "ch": "24", "x": "“The second story as high as the fourth,” a window over a flickering street light and tall trees, her bed beside it, a ceiling fan, and her cubed paintings of marionettes and angels on the walls."}, {"t": "Found", "ch": "30", "x": "She is found dead “in a room with shut blinds on the morning of inspections.”"}], "notes": []}, {"id": "store", "name": "The Antique Store", "cat": "Rooms, houses and halls", "ch": "35", "lead": "A maze of trinkets in the rain.", "forms": [{"t": "Store", "ch": "35", "x": "Gold-like trinkets, paintings leaning on shelves, velvet-like wine carpets, a miniature train, cups of pearls and marbles, toy soldiers, a mannequin in a sapphire hat, and a smell of library, lacquer and coins. In one corner, dolls sit over an old piano beneath the jester painting, by a window of rain."}], "notes": []}, {"id": "trailer", "name": "Damon's Trailer", "cat": "Rooms, houses and halls", "ch": "42", "lead": "A trailer of wires, pills and a bathroom.", "forms": [{"t": "Pills", "ch": "42", "x": "Damon's room is cluttered with wires and objects, with a sleeping bag and a blue curtain. The hallway has brown wood-grain wallpaper; his brother's room holds a safe; the bathroom has a hanging door, a missing hot-water knob, and a piss-soaked rug on a carpetless floor."}], "notes": []}, {"id": "bathroom", "name": "The Bathroom of the Empty Cradle", "cat": "Rooms, houses and halls", "ch": "28", "lead": "Red and blue lights through the blinds.", "forms": [{"t": "Dead Baby", "ch": "28", "x": "Blue and red lights square through the blinds onto the wall; sirens; a tile floor; the yellow of the hall breaking through the door; stars beginning to shine from the textured white ceiling."}], "notes": []}, {"id": "clownroom", "name": "The Clowns' Room", "cat": "Visions and other realms", "ch": "38", "lead": "A box, a stretcher and a papyrus edge.", "forms": [{"t": "Joy & Pleasure", "ch": "38", "x": "A ride inside a box with clowns, and a room where the man lies bound by wires and leather cuffs under small surgical blades, until the clowns point to “the edge of a papyrus they were all written into.”"}], "notes": []}, {"id": "desert", "name": "The Desert of the Rite", "cat": "Visions and other realms", "ch": "18", "lead": "A cold new-moon desert.", "forms": [{"t": "Kether: Meat Ends of Three Snakes", "ch": "18", "x": "Mining-town tropical nights with desert signs, abandoned basements, then a desert of sand-smog under a cold new-moon night, symbols across the ground, and a cup scooped in the sand that catches tears and spit."}], "notes": []}, {"id": "godmachine", "name": "The God Machine", "cat": "Visions and other realms", "ch": "37", "lead": "A fractal of every eternity.", "forms": [{"t": "YHWH; 25291791441265", "ch": "37", "x": "Reflections in every direction, “more precise than atoms,” though there are no mirrors, only patterns. “The ineffable God Machine is stretching every which way, almost like an unfolding synesthesia.” Each fractal houses every cycle of God's existence with creation, and deep inside it the narrator finds a body, and is pulled into it in the stone corridors."}], "notes": []}, {"id": "twosuns", "name": "The Land of Two Suns", "cat": "Visions and other realms", "ch": "39", "lead": "Mountains, a crystal shore and two setting suns.", "forms": [{"t": "Chalice of Tears", "ch": "39", "x": "Two suns rise, one red and one blue, over tall rolling mountains; the sky mixes purple, velvet, indigo, scarlet and “sapphiric neptune haze.” At the other pole a shore crystallizes with refractions. Between them, Red and Blue meet at dusk."}], "notes": []}, {"id": "tiles", "name": "The Black-and-White Tiles", "cat": "Visions and other realms", "ch": "41", "lead": "A world of squares, a bridge-door and words.", "forms": [{"t": "Words for Reading", "ch": "41", "x": "A purple blob stretches over black-and-white tiles toward the other side; a door becomes a bridge, cheered by jester machines in orange and blue with little flutes; beyond it are five squares and an awfully long hallway, until the words themselves begin reading."}], "notes": []}];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const box=document.getElementById("entries"),idx=document.getElementById("index"),jump=document.getElementById("jump"),q=document.getElementById("q"),count=document.getElementById("count");
const sel={};
function formHtml(e,i){const f=e.forms[i];return `<div class="form" role="tabpanel" id="p-${e.id}" aria-labelledby="t-${e.id}-${i}"><h4>${esc(f.t)}<span>ch. ${esc(f.ch)}</span></h4><p>${esc(f.x)}</p></div>`}
function art(e){
  const i=sel[e.id]||0;
  const tabs=e.forms.length>1?`<div class="tabs" role="tablist" aria-label="Forms of ${esc(e.name)}">${e.forms.map((f,k)=>`<button type="button" role="tab" id="t-${e.id}-${k}" aria-controls="p-${e.id}" aria-selected="${k===i}" tabindex="${k===i?0:-1}" data-e="${e.id}" data-k="${k}">${esc(f.t)}</button>`).join("")}</div>`:"";
  return `<article id="${e.id}"><h3>${esc(e.name)}</h3><p class="meta">${esc(e.cat)} · ch. ${esc(e.ch)}${e.forms.length>1?` · ${e.forms.length} forms`:""}</p><p class="lead">${esc(e.lead)}</p>${tabs}${formHtml(e,i)}${e.notes.map(n=>`<p class="note">${esc(n)}</p>`).join("")}</article>`;
}
function matches(e,t){if(!t)return true;t=t.toLowerCase();return [e.name,e.lead,e.ch,...e.forms.map(f=>f.t+" "+f.x),...e.notes].join(" ").toLowerCase().includes(t)}
function render(){
  const t=q.value.trim();let n=0;
  box.innerHTML=CATS.map(c=>{const list=E.filter(e=>e.cat===c&&matches(e,t));n+=list.length;return list.length?`<section class="cat"><h2>${esc(c)}</h2>${list.map(art).join("")}</section>`:""}).join("")||`<p class="empty">Nothing in the codex matches “${esc(t)}”.</p>`;
  count.textContent=t?`${n} of ${E.length} entries`:`${E.length} entries`;
}
function wireTabs(){}
box.addEventListener("click",ev=>{const b=ev.target.closest("button[role=tab]");if(!b)return;sel[b.dataset.e]=+b.dataset.k;swap(b.dataset.e,true)});
box.addEventListener("keydown",ev=>{const b=ev.target.closest("button[role=tab]");if(!b||!["ArrowRight","ArrowLeft","Home","End"].includes(ev.key))return;ev.preventDefault();
  const e=E.find(x=>x.id===b.dataset.e),L=e.forms.length;let k=+b.dataset.k;
  k=ev.key==="ArrowRight"?(k+1)%L:ev.key==="ArrowLeft"?(k-1+L)%L:ev.key==="Home"?0:L-1;sel[e.id]=k;swap(e.id,true)});
function swap(id,focus){const a=document.getElementById(id);const e=E.find(x=>x.id===id);const k=sel[id]||0;
  a.querySelectorAll("button[role=tab]").forEach((b,j)=>{b.setAttribute("aria-selected",j===k);b.tabIndex=j===k?0:-1});
  a.querySelector(".form").outerHTML=formHtml(e,k);if(focus)a.querySelector(`#t-${id}-${k}`).focus()}
idx.innerHTML=CATS.map(c=>`<h2>${esc(c)}</h2><ul>${E.filter(e=>e.cat===c).map(e=>`<li><a href="#${e.id}" data-id="${e.id}">${esc(e.name)}</a></li>`).join("")}</ul>`).join("");
CATS.forEach(c=>{const g=document.createElement("optgroup");g.label=c;E.filter(e=>e.cat===c).forEach(e=>{const o=document.createElement("option");o.value=e.id;o.textContent=e.name;g.appendChild(o)});jump.appendChild(g)});
jump.addEventListener("change",()=>{if(!jump.value)return;if(q.value){q.value="";render()}location.hash=jump.value;document.getElementById(jump.value)?.scrollIntoView()});
idx.addEventListener("click",ev=>{const a=ev.target.closest("a");if(a&&q.value){q.value="";render()}});
q.addEventListener("input",render);
render();
const links=[...idx.querySelectorAll("a")];
const io=new IntersectionObserver(es=>{es.forEach(x=>{if(x.isIntersecting){links.forEach(a=>a.classList.toggle("cur",a.dataset.id===x.target.id))}})},{rootMargin:"0px 0px -70% 0px"});
function observe(){io.disconnect();box.querySelectorAll("article").forEach(a=>io.observe(a))}
observe();q.addEventListener("input",observe);
if(location.hash){const t=document.getElementById(location.hash.slice(1));t&&t.scrollIntoView()}
</script>
