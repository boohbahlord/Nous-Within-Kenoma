<style>
/* Layout: a night chart. The web fills the left, a reading panel sits right (stacks below on phones). Single dark world on purpose. */
:root{
  --ink:#1b120b;        /* page ground, dark burnt amber */
  --vellum:#24180f;     /* raised panel */
  --bone:#f3d6a6;       /* main text */
  --dim:#c9a274;        /* secondary text */
  --gilt:#e9a157;       /* accent */
  --rule:#4d331f;       /* hairlines */
  --soul:#d9b45f; --angel:#cfe0f0; --power:#a68ad8; --serpent:#c4554a; --limbo:#7fb59a; --puppet:#c6a3b8; --mortal:#b9a989;
  --display:"Cascadia Code","Cascadia Mono",Consolas,"Courier New",monospace;
  --body:"Cascadia Code","Cascadia Mono",Consolas,"Courier New",monospace;
  color-scheme:dark;
}
html{background:var(--ink);color:var(--bone)}
body{background:transparent;margin:0}
body{font-family:var(--body);font-weight:200;font-size:15px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
header{max-width:1400px;margin:0 auto 14px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline;justify-content:space-between}
h1{font-family:var(--display);font-weight:200;font-size:clamp(26px,4vw,38px);letter-spacing:.02em;margin:0;color:var(--gilt);text-wrap:balance}
.sub{color:var(--dim);font-style:italic;margin:0;max-width:62ch}
.wrap{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px}
@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;border:1px solid var(--rule);background:radial-gradient(ellipse at 50% 45%,#2a1b0f 0%,#120b06 78%);min-height:620px;height:80vh;overflow:hidden;border-radius:0}
@media (max-width:900px){.stage{height:72vh;min-height:480px}}
svg#web{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
svg#web:active{cursor:grabbing}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:10px 0 0}
.controls label{display:flex;gap:8px;align-items:center;color:var(--bone);cursor:pointer;font-size:14px}
.controls select{font-family:var(--body);font-size:14px;background:var(--vellum);color:var(--bone);border:1px solid var(--rule);padding:6px 8px;border-radius:0;max-width:100%}
.sw{display:inline-block;width:34px;height:0;border-top:2px solid var(--bone);vertical-align:middle}
.sw.stated{border-top-width:4px}
.sw.scene{border-top-width:1.5px}
.sw.echo{border-top:2px dashed var(--bone)}
.sw.note{border-top:2.5px dotted var(--gilt)}
button.reset{font-family:var(--body);font-size:14px;background:transparent;color:var(--gilt);border:1px solid var(--gilt);padding:5px 12px;cursor:pointer;border-radius:0}
button.reset:hover,button.reset:focus-visible{background:var(--gilt);color:var(--ink);outline:none}
input[type=checkbox]{accent-color:var(--gilt);width:16px;height:16px}
aside{background:var(--vellum);border:1px solid var(--rule);padding:18px 20px;border-radius:0;min-width:0;max-height:calc(80vh + 52px);overflow:auto}
@media (max-width:900px){aside{max-height:none}}
aside h2{letter-spacing:.04em;font-family:var(--display);font-weight:200;font-size:26px;margin:0 0 2px;color:var(--gilt);text-wrap:balance}
aside .ch{font-size:13px;color:var(--dim);letter-spacing:.04em;margin:0 0 10px}
aside p{margin:0 0 10px}
aside .note{border-left:2px dotted var(--gilt);padding-left:10px;color:var(--dim);font-style:italic}
aside h3{text-transform:uppercase;letter-spacing:.18em;font-size:13px;font-family:var(--display);font-weight:200;font-size:17px;letter-spacing:.06em;color:var(--bone);margin:16px 0 6px;border-bottom:1px solid var(--rule);padding-bottom:4px}
aside ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
aside li{font-size:14px;line-height:1.45}
aside li button{all:unset;cursor:pointer;color:var(--bone);font-weight:500;border-bottom:1px solid var(--rule)}
aside li button:hover,aside li button:focus-visible{color:var(--gilt);border-color:var(--gilt)}
aside li .c{color:var(--dim);font-size:12.5px}
.legend{display:grid;gap:8px;margin:10px 0 0}
.legend div{font-size:14px}.legend .sw{margin-right:8px}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
.keys{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;font-size:13px;color:var(--dim)}
.keys span{display:flex;gap:6px;align-items:center}
.node text{font-family:var(--body);fill:var(--bone);paint-order:stroke;stroke:var(--ink);stroke-linejoin:round;pointer-events:none}
.node circle{stroke:var(--ink);stroke-width:1.5px;cursor:pointer}
.node:focus{outline:none}
.node:focus-visible circle{stroke:var(--gilt);stroke-width:3px}
.faded{opacity:.12}
.why{display:grid;gap:9px}
.why li{display:flex;gap:9px;align-items:flex-start;font-size:13.5px}
.why .dot{margin-top:6px}
.link{fill:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
const GROUPS={
  soul:{name:"Central figures",c:"--soul"},
  angel:{name:"Angels",c:"--angel"},
  power:{name:"Powers and fates",c:"--power"},
  serpent:{name:"Serpents, demons, beasts",c:"--serpent"},

  puppet:{name:"Puppets, dolls, shadows",c:"--puppet"},

const N=[
 {id:"antony",name:"Antony",g:"angel",ch:"5, 10, 19, 20, 22, 23, 32, 33, 34, 37",d:"Guardian angel. A machine with a cracked white porcelain mask on a wall crucifix, speaking in a broken analog tenor (5, 32, 34). The restless one among the angels hung by their spines from the stars; he climbs to the demiurge's gates and splits his tongue, then is beheaded by Satan, his head sinking into Leviathan's ocean (10). Pulled from the oceans without wings; speaks of Tartarus and of his sleeping half, the sleeping demi-God he vows to save; set into Samson's new heart (19). Kills Leviathan with a spear of its spine and regains his wings (20). Hung and brutalized by Kether, then fights Satan for him (22)."},
 {id:"christopher",name:"Christopher",g:"soul",ch:"5, 18, 24, 26, 30, 34, 37, 42",d:"Born into withdrawal in the stone chamber; walks into the maiden despite Antony's warning while a woman combs his hair and begs him to come back; mouths “Go away, Antony” (5). Named in the desert rite of the chapter titled Kether (18). His name comes to Alice's mind (24). Falls out of the maiden, pockmarked and gas-burned, while the machine angel calls his name (34). Pulled from the maiden by Alice; wakes and says her name (37)."},
 {id:"alice",name:"Alice",g:"soul",ch:"24, 30, 35, 37",d:"An artist alone in her bedroom at night. A porcelain doll from one of her own paintings sits on her bed, says “Your love, he is free now,” and asks to talk about Christopher; then a voice in the dark says “I am the nothingness…” (24). Falls down a rabbit hole into the Fool's circus tent, is killed by the goat-headed bull, and is found dead of heroin and PCP in her apartment (30). “By Alice Love” is the name on the jester painting (35). At the stone chamber she turns off the phone call from 25291791441265 and wakes Christopher with her tears (37).",note:"Note: the woman in the bedroom in chapter 24 is Alice."},
 {id:"samson",name:"Samson",g:"soul",ch:"15, 19, 20, 26, 29, 30, 31",d:"A soldier in a green mech whose lover was taken; a winged attacker pulls the memory chip from his neck: “She never was” (15). Given a new heart with Antony inside it (19). Brings down Leviathan with Antony, sees the marionettes on the playground stairs, and dies on the shore (20). As a traveler he cuts down the Fool's tree (26), kills the goat-bull (29), and is told he is the waking God, whose half is the sleeping God (31)."},
 {id:"kether",name:"Kether",g:"soul",ch:"16, 18, 21, 22, 30, 32",d:"Eighteen-year-old leader of the Tiphareth Euclids, worshipped as a God (16). Gives his name to the chapter of the desert rite (18). Hears Leviathan's whisper (21). Hangs and brutalizes Antony, sees a pink television in a vision, and is saved by Antony from Satan: “Antony! I am awake!” (22). Tells Antony in a dream the drugs are only an imitation; screams “This is all there is!” (32)."},
 {id:"hermit",name:"The Hermit",g:"soul",ch:"14",d:"Sees spirits call him God, then dies on a yellow-lit brown carpet while a brother tries to help him and Lucifer sits on his heart, whispering “You are God; there is nothing else” (14)."},
 {id:"lucifer",name:"Lucifer",g:"serpent",ch:"6, 14, 18, 21, 22, 25, 34, 36, 38, 41",d:"“Familiar to the Lucifer” (6). The brother in the Hermit's vision, then sits on his heart (14). “The Lucifer of lies in his heart” in Christopher's rite (18). Squeezes Kether's exposed heart (22). Tells the golden good puppet “You are God” (25). A voice calls “Hey, Lucifer!” (34). In his new form, a flying angel doll with bleeding eyes, he rescues Yaldabaoth with a ladder made of a word, is cursed and cast down with his brother Ouroboros, whom he swallows to protect (36). A clown who learns they are “just words” on a papyrus (38). Speaks through the narrator (41).",note:"Note: delusion and pride; extroverted psychosis. Lucifer is the Antichrist when in the form of the angel doll with the bleeding eyes."},
 {id:"satan",name:"Satan",g:"serpent",ch:"6, 10, 18, 20, 21, 22, 23, 29, 41",d:"“This is wrestling with Satan” (6). Tackles and beheads Antony: “Nothing ever was, Antony” (10). Named as the soul within Christopher's soul (18) and as a feral brother possessing Samson (20). Whispers “This is all there is” to Kether and is pinned to the tree by Antony (22). Leviathan's prisoner, force-fed by puppets in the outer darkness (23)."},
 {id:"ouroboros",name:"Ouroboros",g:"serpent",ch:"4, 6, 18, 21, 23, 25, 36, 38, 41",d:"“The spring fangs of ouroboros” (6). The slither who consumes themselves endlessly, speaking at the rite (18). Poured out like a clay cup by Leviathan; consumes only itself (21). Lucifer's brother, swallowed by him on the fall (36). The paralyzed man in the clowns' hands who laughs “I hate God!” (38). Fed the world by Lucifer (41).",note:"Note: the chaos of nous, introverted."},
 {id:"leviathan",name:"Leviathan",g:"serpent",ch:"1, 4, 6, 10, 18, 19, 20, 21, 22, 23, 33, 36",d:"“I need something made of you” (1). Constricts a shadow on the moon over the desert rite (18). The sea serpent killed at the north shore; afterwards rules the outer darkness of the Kenoma, encircling even the heavens (20). Holds the keys of providence in the moat of nothingness: “I am the nothingness you can never hear” (21). Jailer of Satan, who forces every soul into their toys (23). Shudders at the spirit of life (33)."},
 {id:"yalda",name:"Yaldabaoth",g:"power",ch:"4, 10, 13, 17, 18, 21, 25, 31, 33, 36",d:"The lion-headed serpent demiurge, a mother's mistake (4, 17). His tongue is split by Antony (10). “Plant the seed of Antichrist” (18). Trips into the outermost moat (33). Bridges the moat with his own angels, swallows the souls of the titans, loses the Sun in the tar, is pulled out by Lucifer, makes the star Redemption, and curses Lucifer and Ouroboros (36)."},
 {id:"sophia",name:"Sophia",g:"power",ch:"17, 31",d:"“Sophia's mistake; without father” (17). Mother of the devil-God Yaldabaoth and the form of Wisdom (31).",note:"Note: Sophia is unofficially from the Fullness."},
 {id:"koah",name:"Kōaḥ",g:"power",ch:"2, 4, 18, 19",d:"The soothsaying voice (2, 4); shown “by the form of the magician” (18); Leviathan's death is “the pleasure of kōaḥ” (19).",note:"Note: clarity as madness."},
 {id:"crab",name:"Woman with crab claws",g:"power",ch:"19, 20, 36",d:"A shadow woman standing on the moon, weaving fabrics out of clouds with crab claws; sends Samson to kill Leviathan (19, 20). Sews words from the moon and tells Yaldabaoth his false angels are pawns (36)."},
 {id:"archons",name:"The archons",g:"power",ch:"10, 11, 13, 18",d:"The text names the archons but says little about who they are. The true angels hang from the archons' stars; the archons dare not bind Antony and question the demiurge's place (10). An archon's fired betrayal shoots down the sun (11). “Archonic cell plans” (13). Glow over the desert rite in solidarity (18)."},
 {id:"titans",name:"The three titans",g:"power",ch:"36",d:"Titans in the first moat, twelve times taller than Yaldabaoth and covered in seven hundred and seventy-seven eyes, who watch his pride “for thirteen infinitudes”; his shadow swallows their souls (36)."},
 {id:"sun",name:"The Sun",g:"power",ch:"36",d:"Yanked from the sky by Yaldabaoth: “My will is to be let free!” Thrown into the moat, it sinks into the tar, and a second Sun is spat out in its place (36)."},
 {id:"redemption",name:"Redemption",g:"power",ch:"36",d:"A star breathed out in Yaldabaoth's heaven to heal the angels willing to forgive themselves; three hundred and sixty accept (36)."},
 {id:"spirit",name:"The spirit of life",g:"power",ch:"33",d:"A bright spirit roaming outside every realm, even the outer darkness: “We are the same!” The Leviathan shudders, Yaldabaoth flees, and the spirit descends to search for the sleeper caught in between (33)."},
 {id:"truea",name:"The true angels",g:"angel",ch:"10",d:"Angels hung by the spine from the stars of the archons, their sparks quiet like sleeping giants, praying for their dignities to return; set apart from angels “mimicked three hundred and sixty-five times” (10)."},
 {id:"falsea",name:"The false angels",g:"angel",ch:"36",d:"Yaldabaoth's three hundred and sixty-one angels: torn by the wings, sewn shut, and bound into a bridge over the moat; three hundred and sixty are healed by Redemption. The woman with crab claws calls them “false angels” (36)."},
 {id:"wired",name:"Wired angels",g:"angel",ch:"7, 15",d:"Angels with metal below the ear who put a drive behind the narrator's ear (7). A black-winged angel leads soldiers against Samson and pulls the memory chip from behind his ear (15)."},
 {id:"curse",name:"Curse",g:"angel",ch:"36",d:"The one of Yaldabaoth's 361 angels who refuses the healing of Redemption; thrown down to Earth like a meteor (36)."},
 {id:"fool",name:"The Fool",g:"limbo",ch:"26, 30, 35",d:"A long-nosed Jester on the only tree of his realm, given by God; Samson cuts it down (26). Lowers on a fish hook into his circus tent and calls the bull on Alice (30). A jester on a tree is the subject of the painting by Alice Love (35)."},
 {id:"wisdom",name:"Wisdom of Limbo",g:"limbo",ch:"31",d:"“Wisdom of the first of third Limbo,” a fool's relation hanging as a shadow from the tree of both life and death; tells Samson he is the waking God and how to save the one who is neither living nor dead (31)."},
 {id:"goatbull",name:"Goat-bull devil",g:"serpent",ch:"29",d:"A seven-foot bull-headed goat devil guarding the gate with the black joker lock; killed by Samson with a spear grown from a spine (29).",note:"Note: a guardian demon."},
 {id:"bull",name:"Bull with a goat's head",g:"serpent",ch:"30",d:"Dragged into the circus tent by eight boy puppets on sixteen ropes; tramples Alice (30)."},
 {id:"anti",name:"The Antichrist",g:"serpent",ch:"7, 18, 28, 30, 34, 36",d:"A snake whisper promises the narrator as antichrist (7). “Drop the seed, plant the seed of Antichrist,” says the demiurge (18). “I become the Antichrist by doing this,” says the mother; a porcelain baby angel doll hangs by a string, crying bloody lamb tears (28). A baby doll with angel wings crying blood unrolls the circus banner (30). A baby doll in angel wings, bleeding tears, hangs over a scroll: “I am the Antichrist” (34). The flying angel doll with bleeding eyes is Lucifer's new form (36).",note:"Note: Lucifer is the Antichrist when in the form of the angel doll with the bleeding eyes."},
 {id:"golden",name:"The Good Puppet · Golden Child",g:"puppet",ch:"9, 25, 34",d:"Talks to God with his hand on a fuzzy pink television, smacks his head on a counter, and says “I'm a good puppet. I hope I am dead.” as the phone rings (9). Painted gold, he stomps his copy, stands covered in gold at a broken pink television: “Yaldabaoth is betrayed,” and is told “You are God” (25). A bald man of forty-three wired into his hoard with a pink television; he stops at his name when a voice calls “Hey, Lucifer!”, sees a bleeding angel doll over a scroll reading “I am the Antichrist,” and wakes on the stone floor, where the machine angel calls out to him (34).",note:"Note: the man in Thistle Rope is the Good Puppet and the Golden Child."},
 {id:"rosy",name:"The boy in overalls",g:"puppet",ch:"23, 25, 42",d:"A dark-haired, rosy-cheeked porcelain boy in overalls who force-feeds Satan, in a voice that mocks Antony (23). A puppet boy in overalls on the tire swing: “Lucifer, you're stupid” (25). Remembered in Damon's flash (42)."},
 {id:"puppets",name:"The puppets and marionettes",g:"puppet",ch:"3, 4, 20, 23, 24, 30, 34, 35",d:"“Hollow marionette” (3); “marionettes of marionettes” (4). Smiling puppets marching on playground stairs in the outer darkness (20). The marigold round singing “Row, row, row your boat,” who force-feed Satan (23). The clicking doll in Alice's bedroom (24). The circus crowd that pelts Alice with hearts (30). Wee puppets in mouse holes (34). Antique dolls over the old piano (35)."},
 {id:"clowns",name:"The clowns",g:"puppet",ch:"38",d:"Clowns who wheel a paralyzed man on a dotted stretcher, feast on blue worms from under his skin, and laugh with him at God, until one says they are “just words” (38)."},
 {id:"shadows",name:"Shadow people",g:"puppet",ch:"22, 34",d:"Black shadows of many forms rise on the walls of the crimson hallway (22). Shadows on the walls mutter a name without noise; one kicks the hoard over: “I been wanting to tell you something” (34)."},
 {id:"chin",name:"The Long Chin Shadow",g:"puppet",ch:"11, 18, 22",d:"“The dark one” who whispers to Thomas (11). “A shadow chin darkness as Virgil guidance” in the desert rite (18). The chin shadow that whispers to Kether, “The chase is the rabbit chased” (22)."},
 {id:"opi",name:"Opi and Noidy",g:"puppet",ch:"11",d:"Button-eyed yarn dolls: black-haired Opi and red-haired Noidy, who carries a necromantic wax seal (11)."},
 {id:"thomas",name:"Thomas",g:"mortal",ch:"11",d:"Shoots his convulsing wife, follows the dark one to a red house, and is lost in a box of mirrors (11)."},
 {id:"anna",name:"Ana",g:"mortal",ch:"11",d:"Thomas's wife in a scarlet dress and charcoal rabbit mask; once buried him in a wax seal under a new moon (11)."},
 {id:"boy6",name:"The hived boy",g:"mortal",ch:"6",d:"A sixteen-year-old covered in hives who, possessed, kills his rabbit-masked father and wakes at dawn beside the body (6)."},
 {id:"rabbit",name:"The rabbit-masked father",g:"mortal",ch:"6",d:"Beats his son in a grey stone rabbit mask and is killed by him (6)."},
 {id:"mother",name:"The mother",g:"mortal",ch:"28",d:"Huffs in a bathroom with sirens outside, the cradle empty; hears spirits and a baby that is gone (28)."},
 {id:"sarah",name:"Sarah",g:"mortal",ch:"35",d:"Buys the jester painting signed “By Alice Love” and an unpriced VHS tape (35)."},
 {id:"louis",name:"Louis",g:"mortal",ch:"35",d:"The old shopkeeper; says the painter recently passed away (35)."},
 {id:"damon",name:"Damon",g:"mortal",ch:"42",d:"Fights his brother over the pills, kills him, hears his father on the phone, and is beaten into the toilet by the brother he shot (42)."},
 {id:"brother",name:"Damon's brother",g:"mortal",ch:"42",d:"Fights Damon over the pills, is shot with his phone dialed, and returns riddled with fatal wounds to stop Damon from flushing them (42)."},
 {id:"father",name:"The father",g:"mortal",ch:"42",d:"Father of both brothers, on the line 25291791441265: “You need to take those pills… We'll have to repeat it again” (42)."},
 {id:"red",name:"Red",g:"mortal",ch:"39",d:"A crimson rose of a man chasing Blue's rain with a golden chalice (39)."},
 {id:"blue",name:"Blue",g:"mortal",ch:"39",d:"A trumpet-gentian woman carried away on the breeze (39)."},
 {id:"binah",name:"Euclids of Binah",g:"mortal",ch:"16, 19",d:"Southern Euclids who empty themselves and keep soul-locked grunts (16); give Samson his new heart (19)."},
 {id:"tiph",name:"Euclids of Tiphareth",g:"mortal",ch:"16",d:"Northern Euclids of pleasure, bondage and new drugs, led by Kether (16)."}
];

const TYPE={stated:{w:3.6,dash:null,label:"Stated in the text"},scene:{w:1.3,dash:null,label:"Share a scene"},echo:{w:1.5,dash:"6 5",label:"Cross-chapter link"},note:{w:2.2,dash:"1.5 5",label:"Note"}};
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const col=g=>css(GROUPS[g].c);
const byId=Object.fromEntries(N.map(n=>[n.id,n]));
const links=L.map(([s,t,type,ch,lab])=>({source:s,target:t,type,ch,lab}));
const deg={};links.forEach(l=>{deg[l.source]=(deg[l.source]||0)+1;deg[l.target]=(deg[l.target]||0)+1});

const svg=d3.select("#web"),stage=document.getElementById("stage");
const WW=1900,WH=1450;
const root=svg.append("g");
let K=1;
const zoom=d3.zoom().scaleExtent([.25,4]).on("zoom",e=>{root.attr("transform",e.transform);K=e.transform.k;sizeLabels()});
svg.call(zoom);
const anchors={soul:[.47,.44],angel:[.40,.08],power:[.86,.14],serpent:[.84,.64],limbo:[.12,.70],puppet:[.12,.22],mortal:[.48,.93]};
const REST={stated:.42,scene:.16,echo:.26,note:.5};
const linkSel=root.append("g").selectAll("line").data(links).join("line").attr("class","link")
  .attr("stroke",d=>d.type==="note"?css("--gilt"):css("--bone")).attr("stroke-opacity",d=>REST[d.type])
  .attr("stroke-width",d=>TYPE[d.type].w).attr("stroke-dasharray",d=>TYPE[d.type].dash).attr("stroke-linecap","round");
const nodeSel=root.append("g").selectAll("g").data(N).join("g").attr("class","node").attr("tabindex",0).attr("role","button")
  .attr("aria-label",d=>d.name);
const rad=d=>8+Math.sqrt(deg[d.id]||1)*2.6;
nodeSel.append("circle").attr("r",rad).attr("fill",d=>col(d.g));
nodeSel.append("text").text(d=>d.name).attr("y",5);
function sizeLabels(){const k=Math.max(K,.3);nodeSel.select("text").attr("font-size",(13/k).toFixed(2)+"px").attr("stroke-width",(5/k).toFixed(2)+"px").attr("x",d=>rad(d)+5/k)}

function labelBoxes(alpha){
  /* keep each name's label box (to the right of its dot) from overlapping any other */
  const B=N.map(d=>({d,x0:d.x-rad(d)-6,x1:d.x+rad(d)+12+d.name.length*19,y0:d.y-24,y1:d.y+24}));
  for(let i=0;i<B.length;i++)for(let j=i+1;j<B.length;j++){
    const a=B[i],b=B[j];
    const ox=Math.min(a.x1,b.x1)-Math.max(a.x0,b.x0),oy=Math.min(a.y1,b.y1)-Math.max(a.y0,b.y0);
    if(ox<=0||oy<=0)continue;
    const k=Math.min(1,alpha*14);
    if(oy<ox){const s=(a.d.y<b.d.y?-1:1)*oy*.5*k;a.d.vy+=s;b.d.vy-=s}
    else{const s=(a.d.x<b.d.x?-1:1)*ox*.5*k;a.d.vx+=s;b.d.vx-=s}
  }
}
const sim=d3.forceSimulation(N)
  .force("link",d3.forceLink(links).id(d=>d.id).distance(l=>l.type==="stated"?150:l.type==="note"?190:230).strength(l=>l.type==="stated"?.25:.035))
  .force("charge",d3.forceManyBody().strength(-2600).distanceMax(900))
  .force("x",d3.forceX(d=>anchors[d.g][0]*WW).strength(.13))
  .force("y",d3.forceY(d=>anchors[d.g][1]*WH).strength(.15))
  .force("collide",d3.forceCollide(d=>46+rad(d)).iterations(4))
  .force("labels",labelBoxes)
  .stop();
for(let i=0;i<900;i++)sim.tick();
for(let r=0;r<400;r++){N.forEach(d=>{d.vx=0;d.vy=0});labelBoxes(.08);N.forEach(d=>{d.x+=d.vx;d.y+=d.vy})}
function draw(){
  linkSel.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
  nodeSel.attr("transform",d=>`translate(${d.x},${d.y})`);
}
draw();sim.on("tick",draw);
function fit(){
  const xs=N.map(d=>d.x),ys=N.map(d=>d.y);
  const x0=Math.min(...xs)-30,x1=Math.max(...xs)+260,y0=Math.min(...ys)-30,y1=Math.max(...ys)+30;
  const w=stage.clientWidth,h=stage.clientHeight,k=Math.min(w/(x1-x0),h/(y1-y0));
  svg.call(zoom.transform,d3.zoomIdentity.translate((w-(x1-x0)*k)/2-x0*k,(h-(y1-y0)*k)/2-y0*k).scale(k));
}
fit();
nodeSel.call(d3.drag()
  .on("start",(e,d)=>{if(!e.active)sim.alphaTarget(.15).restart();d.fx=d.x;d.fy=d.y})
  .on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y})
  .on("end",(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));

let selected=null;
const on=t=>document.getElementById("f-"+t).checked;
function apply(){
  linkSel.attr("display",d=>on(d.type)?null:"none");
  if(!selected){linkSel.attr("stroke-opacity",d=>REST[d.type]).attr("stroke-width",d=>TYPE[d.type].w);nodeSel.classed("faded",false);return}
  const keep=new Set([selected]);
  linkSel.each(d=>{if((d.source.id===selected||d.target.id===selected)&&on(d.type)){keep.add(d.source.id);keep.add(d.target.id)}});
  linkSel.attr("stroke-opacity",d=>(d.source.id===selected||d.target.id===selected)?.95:.04)
    .attr("stroke-width",d=>(d.source.id===selected||d.target.id===selected)?TYPE[d.type].w*1.6:TYPE[d.type].w);
  nodeSel.classed("faded",d=>!keep.has(d.id));
}
function select(id){selected=id;apply();render();document.getElementById("pick").value=id||""}
nodeSel.on("click",(e,d)=>{e.stopPropagation();select(selected===d.id?null:d.id)})
  .on("keydown",(e,d)=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select(d.id)}});
svg.on("click",()=>select(null));
["stated","scene","echo","note"].forEach(t=>document.getElementById("f-"+t).addEventListener("change",()=>{apply();render()}));
document.getElementById("reset").addEventListener("click",()=>{select(null);fit()});
const pick=document.getElementById("pick");
[...N].sort((a,b)=>a.name.localeCompare(b.name)).forEach(n=>{const o=document.createElement("option");o.value=n.id;o.textContent=n.name;pick.appendChild(o)});
pick.addEventListener("change",()=>select(pick.value||null));

const WHY={
  soul:"Gold for the spark of light the book says is buried in a soul: “finding the spark buried in lies” (16), “a restless light who found itself realized” (37).",
  angel:"Pale blue-white for the white porcelain of Antony's mask in the blue glow of sparks (5) and the blue lightning of his judgement (20).",
  power:"Violet for rule over the night above creation: the demiurge's heaven of memories, the soothsaying, and the weaver who stands on the moon.",
  serpent:"Red for blood and fire: the crimson hallway where Satan is pinned (22), the ocean reddened by Leviathan's blood (20), the pond turned to blood wine (29).",
  limbo:"Green for the dark green fields of the Fool's realm (26) and the green flats before the pond and gate (29).",
  puppet:"Pink for the painted rosy cheeks of porcelain dolls and puppets (20, 23).",
  mortal:"Tan, plain parchment, for people who live inside a single story, outside the main cycle of souls, angels and powers."
};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){
  const P=document.getElementById("panel");
  if(!selected){
    P.innerHTML=`<h2>How to read it</h2>
    <p>Each figure sits in the region of its kind. Tap one to light up only its own connections and read its chapters here. Drag the background to move around, pinch or scroll to zoom, and press <b>Show all</b> to return to the full view.</p>
    <h3>The lines</h3>
    <div class="legend">
      <div><span class="sw stated"></span><b>Stated in the text</b>: the page names the bond (brother, guardian angel, lover, mother).</div>
      <div><span class="sw scene"></span><b>Share a scene</b>: they meet, fight or speak to each other on the page.</div>
      <div><span class="sw echo"></span><b>Cross-chapter link</b>: a name, smell, memory, number or object that ties two chapters together.</div>
      <div><span class="sw note"></span><b>Note</b>: given by the author, not written on the page.</div>
    </div>
    <h3>Why these colors</h3>
    <p class="ch">Color marks what kind of being a figure is, not whether it is good or evil.</p>
    <ul class="why">${Object.entries(GROUPS).map(([k,g])=>`<li><i class="dot" style="background:${col(k)}"></i><span><b>${esc(g.name)}.</b> ${esc(WHY[k])}</span></li>`).join("")}</ul>
    <h3>Left out</h3>
    <p class="ch">Chapter 40 (unfinished) and unnamed one-scene figures. Names are kept exactly as each chapter gives them.</p>`;
    return;
  }
  const n=byId[selected];
  const mine=links.filter(l=>(l.source.id===selected||l.target.id===selected)&&on(l.type));
  const groupsHtml=["stated","scene","echo","note"].map(t=>{
    const ls=mine.filter(l=>l.type===t);if(!ls.length)return"";
    return `<h3>${TYPE[t].label}</h3><ul>${ls.map(l=>{const o=l.source.id===selected?l.target:l.source;
      return `<li><button type="button" data-id="${o.id}">${esc(o.name)}</button>: ${esc(l.lab)} <span class="c">${l.ch==="—"?"":"ch. "+esc(l.ch)}</span></li>`}).join("")}</ul>`}).join("");
  P.innerHTML=`<h2>${esc(n.name)}</h2><p class="ch"><i class="dot" style="background:${col(n.g)};margin-right:6px;vertical-align:middle"></i>${esc(GROUPS[n.g].name)} · chapters ${esc(n.ch)}</p><p>${esc(n.d)}</p>${n.note?`<p class="note">${esc(n.note)}</p>`:""}${groupsHtml||"<p class='ch'>No connections under the current filters.</p>"}`;
  P.querySelectorAll("button[data-id]").forEach(b=>b.addEventListener("click",()=>select(b.dataset.id)));
}
render();apply();sizeLabels();
let rt;window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(fit,150)});
</script>
