<style>
/* Layout: a night chart. The web fills the left, a reading panel sits right (stacks below on phones). Single dark world on purpose. */
:root{
  --ink:#100e19;        /* page ground, blue-violet black */
  --vellum:#1a1726;     /* raised panel */
  --bone:#e7dcc6;       /* main text */
  --dim:#9d93a8;        /* secondary text */
  --gilt:#c9a45c;       /* accent */
  --rule:#3a3350;       /* hairlines */
  --soul:#d9b45f; --angel:#cfe0f0; --power:#a68ad8; --serpent:#c4554a; --limbo:#7fb59a; --puppet:#c6a3b8; --mortal:#b9a989;
  --display:"IM Fell English SC","IM Fell English",Georgia,serif;
  --body:"Spectral",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
html,body{background:var(--ink);color:var(--bone)}
body{font-family:var(--body);font-size:15px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
header{max-width:1400px;margin:0 auto 14px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline;justify-content:space-between}
h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,4vw,38px);letter-spacing:.02em;margin:0;color:var(--gilt);text-wrap:balance}
.sub{color:var(--dim);font-style:italic;margin:0;max-width:62ch}
.wrap{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px}
@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;border:1px solid var(--rule);background:radial-gradient(ellipse at 50% 45%,#1d1930 0%,var(--ink) 70%);min-height:620px;height:80vh;overflow:hidden;border-radius:2px}
@media (max-width:900px){.stage{height:72vh;min-height:480px}}
svg#web{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
svg#web:active{cursor:grabbing}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:10px 0 0}
.controls label{display:flex;gap:8px;align-items:center;color:var(--bone);cursor:pointer;font-size:14px}
.controls select{font-family:var(--body);font-size:14px;background:var(--vellum);color:var(--bone);border:1px solid var(--rule);padding:6px 8px;border-radius:2px;max-width:100%}
.sw{display:inline-block;width:34px;height:0;border-top:2px solid var(--bone);vertical-align:middle}
.sw.stated{border-top-width:4px}
.sw.scene{border-top-width:1.5px}
.sw.echo{border-top:2px dashed var(--bone)}
.sw.author{border-top:2.5px dotted var(--gilt)}
button.reset{font-family:var(--body);font-size:14px;background:transparent;color:var(--gilt);border:1px solid var(--gilt);padding:5px 12px;cursor:pointer;border-radius:2px}
button.reset:hover,button.reset:focus-visible{background:var(--gilt);color:var(--ink);outline:none}
input[type=checkbox]{accent-color:var(--gilt);width:16px;height:16px}
aside{background:var(--vellum);border:1px solid var(--rule);padding:18px 20px;border-radius:2px;min-width:0;max-height:calc(80vh + 52px);overflow:auto}
@media (max-width:900px){aside{max-height:none}}
aside h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0 0 2px;color:var(--gilt);text-wrap:balance}
aside .ch{font-size:13px;color:var(--dim);letter-spacing:.04em;margin:0 0 10px}
aside p{margin:0 0 10px}
aside .note{border-left:2px dotted var(--gilt);padding-left:10px;color:var(--dim);font-style:italic}
aside h3{font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:.06em;color:var(--bone);margin:16px 0 6px;border-bottom:1px solid var(--rule);padding-bottom:4px}
aside ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
aside li{font-size:14px;line-height:1.45}
aside li button{all:unset;cursor:pointer;color:var(--bone);font-weight:500;border-bottom:1px solid var(--rule)}
aside li button:hover,aside li button:focus-visible{color:var(--gilt);border-color:var(--gilt)}
aside li .c{color:var(--dim);font-size:12.5px}
.legend{display:grid;gap:8px;margin:10px 0 0}
.legend div{font-size:14px}.legend .sw{margin-right:8px}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
.keys{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;font-size:13px;color:var(--dim)}
.keys span{display:flex;gap:6px;align-items:center}
.node text{font-family:var(--body);fill:var(--bone);paint-order:stroke;stroke:var(--ink);stroke-linejoin:round;pointer-events:none}
.node circle{stroke:var(--ink);stroke-width:1.5px;cursor:pointer}
.node:focus{outline:none}
.node:focus-visible circle{stroke:var(--gilt);stroke-width:3px}
.faded{opacity:.12}
.why{display:grid;gap:9px}
.why li{display:flex;gap:9px;align-items:flex-start;font-size:13.5px}
.why .dot{margin-top:6px}
.link{fill:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header>
  <h1>Nous Within Kenoma · Character Web</h1>
  <p class="sub">Every named figure, linked by what the text shows. Tap a figure to light its connections; drag to move around, pinch or scroll to zoom.</p>
</header>

const N=[
 {id:"antony",name:"Antony",g:"angel",ch:"5, 10, 19, 20, 22, 23, 32, 34, 37",d:"Guardian angel. A machine with a cracked white porcelain mask on a wall crucifix, speaking in a broken analog tenor (5, 32, 34). Climbs to the demiurge's gates and splits his tongue, then is beheaded by Satan, his head sinking into Leviathan's ocean (10). Pulled from the oceans without wings and set into Samson's new heart (19). Kills Leviathan with a spear of its spine and regains his wings (20). Hung and brutalized by Kether, then fights Satan for him (22)."},
 {id:"christopher",name:"Christopher",g:"soul",ch:"5, 18, 24, 26, 30, 34, 37, 42",d:"Born into withdrawal in the stone chamber; walks into the maiden despite Antony's warning while a woman combs his hair and begs him to come back; mouths “Go away, Antony” (5). Named in the desert rite of the chapter titled Kether (18). Falls out of the maiden, pockmarked and gas-burned (34). Pulled from the maiden by Alice; wakes and says her name (37)."},
 {id:"alice",name:"Alice",g:"soul",ch:"30, 35, 37",d:"Falls down a rabbit hole into the Fool's circus tent, is killed by the goat-headed bull, and is found dead of heroin and PCP in her apartment (30). “By Alice Love” is the name on the jester painting (35). At the stone chamber she turns off the phone call from 25291791441265 and wakes Christopher with her tears (37)."},
 {id:"samson",name:"Samson",g:"soul",ch:"15, 19, 20, 26, 29, 30, 31",d:"A soldier in a green mech whose lover was taken; a winged attacker pulls the memory chip from his neck: “She never was” (15). Given a new heart with Antony inside it (19). Brings down Leviathan with Antony and dies on the shore (20). As a traveler he cuts down the Fool's tree (26), kills the goat-bull (29), and is told he is the waking God (31)."},
 {id:"kether",name:"Kether",g:"soul",ch:"16, 18, 21, 22, 30, 32",d:"Eighteen-year-old leader of the Tiphareth Euclids, worshipped as a God (16). Hears Leviathan's whisper (21). Hangs and brutalizes Antony, then is saved by him from Satan: “Antony! I am awake!” (22). Tells Antony in a dream the drugs are only an imitation; screams “This is all there is!” (32)."},
 {id:"hermit",name:"The Hermit",g:"soul",ch:"14",d:"Dies on a yellow-lit brown carpet after a vision of being God, while a brother tries to help him and Lucifer sits on his heart (14)."},
 {id:"sleeping",name:"The Sleeping God",g:"soul",ch:"19, 31",d:"Named by Wisdom as Samson's other half; its most cursed half, “who isn't her,” will become death (31). Antony calls the sleeping demi-God the half of himself he must save (19).",note:"Author's word: the sleeping God's souls run through Alice, Christopher, Kether and the Hermit (dotted lines)."},
 {id:"lucifer",name:"Lucifer",g:"serpent",ch:"6, 14, 18, 21, 22, 25, 34, 36, 38, 41",d:"Brother in the Hermit's vision, then sits on his heart (14). Squeezes Kether's exposed heart (22). Tells the golden puppet “You are God” (25). A voice calls “Hey, Lucifer!” (34). Rescues Yaldabaoth with a ladder made of a word, is cursed and cast down with his brother Ouroboros, whom he swallows to protect (36). A clown who learns they are “just words” on a papyrus (38). Speaks through the narrator (41).",note:"Author's word: delusion and pride, extroverted psychosis."},
 {id:"satan",name:"Satan",g:"serpent",ch:"6, 10, 18, 20, 21, 22, 23, 29, 41",d:"Tackles and beheads Antony: “Nothing ever was, Antony” (10). Whispers “This is all there is” to Kether and is pinned to the tree by Antony (22). Leviathan's prisoner, force-fed by puppets in the outer darkness (23). Named as a feral brother possessing Samson (20) and as the soul within Christopher's soul (18)."},
 {id:"ouroboros",name:"Ouroboros",g:"serpent",ch:"4, 6, 18, 21, 23, 25, 36, 38, 41",d:"Poured out like a clay cup by Leviathan; consumes only itself (21). Lucifer's brother, swallowed by him on the fall (36). The paralyzed man in the clowns' hands who laughs “I hate God!” (38). Fed the world by Lucifer (41).",note:"Author's word: the chaos of nous, introverted."},
 {id:"leviathan",name:"Leviathan",g:"serpent",ch:"1, 4, 6, 10, 18, 19, 20, 21, 22, 23, 36",d:"Holds the keys of providence in the moat of nothingness (21). The sea serpent killed at the north shore; afterwards rules the outer darkness of the Kenoma, encircling even the heavens (20). Jailer of Satan (23)."},
 {id:"yalda",name:"Yaldabaoth",g:"power",ch:"4, 10, 13, 17, 18, 21, 25, 31, 33, 36",d:"The lion-headed serpent demiurge, a mother's mistake (4, 17). His tongue is split by Antony (10). Trips into the outermost moat (33). Bridges the moat with his own angels, loses the Sun in the tar, is pulled out by Lucifer, makes the star Redemption, and curses Lucifer and Ouroboros (36)."},
 {id:"sophia",name:"Sophia",g:"power",ch:"17, 31",d:"“Sophia's mistake; without father” (17). Mother of the devil-God Yaldabaoth and the form of Wisdom (31)."},
 {id:"koah",name:"Kōaḥ",g:"power",ch:"2, 4, 18, 19",d:"The soothsaying voice (2, 4); shown “by the form of the magician” (18); Leviathan's death is “the pleasure of kōaḥ” (19).",note:"Author's word: clarity as madness."},
 {id:"crab",name:"Woman with crab claws",g:"power",ch:"19, 20, 36",d:"A shadow woman standing on the moon, weaving fabrics out of clouds with crab claws; sends Samson to kill Leviathan (19, 20). Sews words from the moon and tells Yaldabaoth his angels are pawns (36)."},
 {id:"curse",name:"Curse",g:"angel",ch:"36",d:"The one of Yaldabaoth's 361 angels who refuses the healing of Redemption; thrown down to Earth like a meteor (36)."},

 {id:"wisdom",name:"Wisdom of Limbo",g:"limbo",ch:"31",d:"“Wisdom of the first of third Limbo,” a fool's relation hanging from the tree of both life and death; tells Samson he is the waking God and how to save the one who is neither living nor dead (31)."},
 {id:"goatbull",name:"Goat-bull devil",g:"serpent",ch:"29",d:"A seven-foot bull-headed goat devil guarding the gate with the black joker lock; killed by Samson with a spear grown from a spine (29).",note:"Author's word: a guardian demon."},
 {id:"bull",name:"Bull with a goat's head",g:"serpent",ch:"30",d:"Dragged into the circus tent by eight boy puppets on sixteen ropes; tramples Alice (30)."},
 {id:"rosy",name:"Boy doll in overalls",g:"puppet",ch:"23, 25, 42",d:"A dark-haired, rosy-cheeked porcelain boy in overalls who force-feeds Satan, in a voice that mocks Antony (23). A puppet boy in overalls on the tire swing (25). Remembered in Damon's flash (42)."},
 {id:"golden",name:"The golden good puppet",g:"puppet",ch:"25",d:"Stands covered in gold at a broken pink television: “Yaldabaoth is betrayed.” Told “You are God” (25)."},
 {id:"chin",name:"The long-chinned shadow",g:"puppet",ch:"11, 18, 22",d:"“The dark one” who whispers to Thomas (11). “A shadow chin darkness as Virgil guidance” in the desert rite (18). The chin shadow that whispers to Kether, “The chase is the rabbit chased” (22)."},
 {id:"opi",name:"Opi and Noidy",g:"puppet",ch:"11",d:"Button-eyed yarn dolls: black-haired Opi and red-haired Noidy, who carries a necromantic wax seal (11)."},
 {id:"thomas",name:"Thomas",g:"mortal",ch:"11",d:"Shoots his convulsing wife, follows the dark one to a red house, and is lost in a box of mirrors (11)."},
 {id:"anna",name:"Anna",g:"mortal",ch:"11",d:"Thomas's wife in a scarlet dress and charcoal rabbit mask; once buried him in a wax seal under a new moon (11)."},
 {id:"boy6",name:"The hived boy",g:"mortal",ch:"6",d:"A sixteen-year-old covered in hives who, possessed, kills his rabbit-masked father and wakes at dawn beside the body (6)."},
 {id:"rabbit",name:"The rabbit-masked father",g:"mortal",ch:"6",d:"Beats his son in a grey stone rabbit mask and is killed by him (6)."},
 {id:"woman24",name:"Woman in the bedroom",g:"mortal",ch:"24",d:"An artist frozen by a porcelain doll that says “Your love, he is free now” about Christopher (24)."},
 {id:"mother",name:"The mother",g:"mortal",ch:"28",d:"Huffs in a bathroom with sirens outside, the cradle empty; hears spirits and a baby that is gone (28)."},
 {id:"anti",name:"The Antichrist",g:"serpent",ch:"7, 18, 28, 34",d:"“Drop the seed, plant the seed of Antichrist,” says the demiurge (18). “I become the Antichrist by doing this,” says the mother (28). A scroll reads “I am the Antichrist” (34)."},
 {id:"sarah",name:"Sarah",g:"mortal",ch:"35",d:"Buys the jester painting signed “By Alice Love” and an unpriced VHS tape (35)."},
 {id:"louis",name:"Louis",g:"mortal",ch:"35",d:"The old shopkeeper; says the painter recently passed away (35)."},
 {id:"damon",name:"Damon",g:"mortal",ch:"42",d:"Fights his brother over the pills, kills him, hears his father on the phone, and is beaten into the toilet by the brother he shot (42)."},
 {id:"brother",name:"Damon's brother",g:"mortal",ch:"42",d:"Fights Damon over the pills, is shot with his phone dialed, and returns riddled with fatal wounds to stop Damon from flushing them (42)."},
 {id:"father",name:"The father",g:"mortal",ch:"42",d:"Father of both brothers, on the line 25291791441265: “You need to take those pills… We'll have to repeat it again” (42)."},
 {id:"red",name:"Red",g:"mortal",ch:"39",d:"A crimson rose of a man chasing Blue's rain with a golden chalice (39)."},
 {id:"blue",name:"Blue",g:"mortal",ch:"39",d:"A trumpet-gentian woman carried away on the breeze (39)."},
 {id:"binah",name:"Euclids of Binah",g:"mortal",ch:"16, 19",d:"Southern Euclids who empty themselves and keep soul-locked grunts (16); give Samson his new heart (19)."},
 {id:"tiph",name:"Euclids of Tiphareth",g:"mortal",ch:"16",d:"Northern Euclids of pleasure, bondage and new drugs, led by Kether (16)."}

const zoom=d3.zoom().scaleExtent([.25,4]).on("zoom",e=>{root.attr("transform",e.transform);K=e.transform.k;sizeLabels()});
svg.call(zoom);
const anchors={soul:[.48,.42],angel:[.42,.1],power:[.86,.16],serpent:[.84,.62],limbo:[.14,.66],puppet:[.12,.18],mortal:[.46,.9]};
const REST={stated:.42,scene:.16,echo:.26,author:.5};
const linkSel=root.append("g").selectAll("line").data(links).join("line").attr("class","link")
  .attr("stroke",d=>d.type==="author"?css("--gilt"):css("--bone")).attr("stroke-opacity",d=>REST[d.type])
  .attr("stroke-width",d=>TYPE[d.type].w).attr("stroke-dasharray",d=>TYPE[d.type].dash).attr("stroke-linecap","round");
const nodeSel=root.append("g").selectAll("g").data(N).join("g").attr("class","node").attr("tabindex",0).attr("role","button")
  .attr("aria-label",d=>d.name);
const rad=d=>8+Math.sqrt(deg[d.id]||1)*2.6;
nodeSel.append("circle").attr("r",rad).attr("fill",d=>col(d.g));
nodeSel.append("text").text(d=>d.name).attr("y",5);
function sizeLabels(){const k=Math.max(K,.3);nodeSel.select("text").attr("font-size",(14/k).toFixed(2)+"px").attr("stroke-width",(5/k).toFixed(2)+"px").attr("x",d=>rad(d)+5/k)}

const sim=d3.forceSimulation(N)
  .force("link",d3.forceLink(links).id(d=>d.id).distance(l=>l.type==="stated"?150:l.type==="author"?190:230).strength(l=>l.type==="stated"?.3:.06))
  .force("charge",d3.forceManyBody().strength(-1500).distanceMax(800))
  .force("x",d3.forceX(d=>anchors[d.g][0]*WW).strength(.13))
  .force("y",d3.forceY(d=>anchors[d.g][1]*WH).strength(.15))
  .force("collide",d3.forceCollide(d=>62+rad(d)).iterations(4))
  .stop();
for(let i=0;i<600;i++)sim.tick();
function draw(){
  linkSel.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
  nodeSel.attr("transform",d=>`translate(${d.x},${d.y})`);
}
draw();sim.on("tick",draw);
function fit(){
  const xs=N.map(d=>d.x),ys=N.map(d=>d.y);
  const x0=Math.min(...xs)-30,x1=Math.max(...xs)+260,y0=Math.min(...ys)-30,y1=Math.max(...ys)+30;
  const w=stage.clientWidth,h=stage.clientHeight,k=Math.min(w/(x1-x0),h/(y1-y0));
  svg.call(zoom.transform,d3.zoomIdentity.translate((w-(x1-x0)*k)/2-x0*k,(h-(y1-y0)*k)/2-y0*k).scale(k));
}
fit();
nodeSel.call(d3.drag()
  .on("start",(e,d)=>{if(!e.active)sim.alphaTarget(.15).restart();d.fx=d.x;d.fy=d.y})
  .on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y})
  .on("end",(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));

let selected=null;
const on=t=>document.getElementById("f-"+t).checked;
function apply(){
  linkSel.attr("display",d=>on(d.type)?null:"none");
  if(!selected){linkSel.attr("stroke-opacity",d=>REST[d.type]).attr("stroke-width",d=>TYPE[d.type].w);nodeSel.classed("faded",false);return}
  const keep=new Set([selected]);
  linkSel.each(d=>{if((d.source.id===selected||d.target.id===selected)&&on(d.type)){keep.add(d.source.id);keep.add(d.target.id)}});
  linkSel.attr("stroke-opacity",d=>(d.source.id===selected||d.target.id===selected)?.95:.04)
    .attr("stroke-width",d=>(d.source.id===selected||d.target.id===selected)?TYPE[d.type].w*1.6:TYPE[d.type].w);
  nodeSel.classed("faded",d=>!keep.has(d.id));
}
function select(id){selected=id;apply();render();document.getElementById("pick").value=id||""}
nodeSel.on("click",(e,d)=>{e.stopPropagation();select(selected===d.id?null:d.id)})
  .on("keydown",(e,d)=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select(d.id)}});
svg.on("click",()=>select(null));
["stated","scene","echo","author"].forEach(t=>document.getElementById("f-"+t).addEventListener("change",()=>{apply();render()}));
document.getElementById("reset").addEventListener("click",()=>{select(null);fit()});
const pick=document.getElementById("pick");
[...N].sort((a,b)=>a.name.localeCompare(b.name)).forEach(n=>{const o=document.createElement("option");o.value=n.id;o.textContent=n.name;pick.appendChild(o)});
pick.addEventListener("change",()=>select(pick.value||null));

const WHY={
  soul:"Gold for the spark of light the book says is buried in a soul: “finding the spark buried in lies” (16), “a restless light who found itself realized” (37).",
  angel:"Pale blue-white for the white porcelain of Antony's mask in the blue glow of sparks (5) and the blue lightning of his judgement (20).",
  power:"Violet for rule over the night above creation: the demiurge's heaven of memories, the soothsaying, and the weaver who stands on the moon.",
  serpent:"Red for blood and fire: the crimson hallway where Satan is pinned (22), the ocean reddened by Leviathan's blood (20), the pond turned to blood wine (29).",
  limbo:"Green for the dark green fields of the Fool's realm (26) and the green flats before the pond and gate (29).",
  puppet:"Pink for the painted rosy cheeks of porcelain dolls and puppets (20, 23).",
  mortal:"Tan, plain parchment, for people who live inside a single story, outside the main cycle of souls, angels and powers."
};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){
  const P=document.getElementById("panel");
  if(!selected){
    P.innerHTML=`<h2>How to read it</h2>
    <p>Each figure sits in the region of its kind. Tap one to light up only its own connections and read its chapters here. Drag the background to move around, pinch or scroll to zoom, and press <b>Show all</b> to return to the full view.</p>
    <h3>The lines</h3>
    <div class="legend">
      <div><span class="sw stated"></span><b>Stated in the text</b>: the page names the bond (brother, guardian angel, lover, mother).</div>
      <div><span class="sw scene"></span><b>Share a scene</b>: they meet, fight or speak to each other on the page.</div>
      <div><span class="sw echo"></span><b>Cross-chapter link</b>: a name, smell, memory, number or object that ties two chapters together.</div>
      <div><span class="sw author"></span><b>Author's word</b>: given by the author, not written on the page.</div>
    </div>
    <h3>Why these colors</h3>
    <p class="ch">Color marks what kind of being a figure is, not whether it is good or evil.</p>
    <ul class="why">${Object.entries(GROUPS).map(([k,g])=>`<li><i class="dot" style="background:${col(k)}"></i><span><b>${esc(g.name)}.</b> ${esc(WHY[k])}</span></li>`).join("")}</ul>
    <h3>Left out</h3>
    <p class="ch">Chapter 40 (unfinished) and unnamed one-scene figures. Names are kept exactly as each chapter gives them.</p>`;
    return;
  }
  const n=byId[selected];
  const mine=links.filter(l=>(l.source.id===selected||l.target.id===selected)&&on(l.type));
  const groupsHtml=["stated","scene","echo","author"].map(t=>{
    const ls=mine.filter(l=>l.type===t);if(!ls.length)return"";
    return `<h3>${TYPE[t].label}</h3><ul>${ls.map(l=>{const o=l.source.id===selected?l.target:l.source;
      return `<li><button type="button" data-id="${o.id}">${esc(o.name)}</button>: ${esc(l.lab)} <span class="c">${l.ch==="—"?"":"ch. "+esc(l.ch)}</span></li>`}).join("")}</ul>`}).join("");
  P.innerHTML=`<h2>${esc(n.name)}</h2><p class="ch"><i class="dot" style="background:${col(n.g)};margin-right:6px;vertical-align:middle"></i>${esc(GROUPS[n.g].name)} · chapters ${esc(n.ch)}</p><p>${esc(n.d)}</p>${n.note?`<p class="note">${esc(n.note)}</p>`:""}${groupsHtml||"<p class='ch'>No connections under the current filters.</p>"}`;
  P.querySelectorAll("button[data-id]").forEach(b=>b.addEventListener("click",()=>select(b.dataset.id)));
}
render();apply();sizeLabels();
let rt;window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(fit,150)});
</script>
