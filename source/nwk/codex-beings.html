<style>
/* Layout: a bound codex on deep indigo. Index left (a select on phones), entries right. Each entry can switch between the forms it takes. */

body{font-family:var(--body);font-size:16.5px;line-height:1.62;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}

nav.index{position:sticky;top:max(12px,env(safe-area-inset-top,0px));max-height:calc(100vh - 24px);overflow:auto;border:1px solid var(--rule);background:var(--well);padding:12px 14px 16px;border-radius:2px}

<script>
const CATS=["Beyond the Kenoma", "Powers and fates", "The demiurge", "Serpents and demons", "Angels", "Puppets, dolls and shadows", "Limbo", "Souls and wanderers", "Figures of single stories"];
const E=[{"id": "nameless", "name": "The Nameless One", "cat": "Beyond the Kenoma", "ch": "4, 16", "lead": "The pure source that the demiurge imitates, never given a name.", "forms": [{"t": "In the sermons", "ch": "4", "x": "The snake's sermons in chapter 4 speak of lost souls “further losing their name of the nameless one; from them pours itself, of itself.” When the demiurge calls himself “the first and only God,” the sermon calls it “a blasphemy against the nameless purity and its indescribable holiness.” Of the place the lost came from it says, “What ought to be is always being, and of itself is complete light.”"}, {"t": "Among the Euclids", "ch": "16", "x": "The Euclids argue over it. The Northern tribe does not see “an absolute nameless simplicity as emanator,” believing instead in an infinite one that only a few may unlock. All the Euclids acknowledge the demiurge; they differ “in the manner and kind of essence of the nameless one, and in solution.”"}], "notes": ["Note: the nameless one belongs to the Fullness, and is what the demiurge imitates."]}, {"id": "sophia", "name": "Sophia", "cat": "Beyond the Kenoma", "ch": "4, 17, 31", "lead": "Mother of Yaldabaoth and the form of Wisdom.", "forms": [{"t": "The mistake", "ch": "4, 17", "x": "Chapter 17 ends by naming the demiurge outright: “Yaldabaoth: the ideal of imperfection, you were only ever a mother's mistake, Sophia's mistake; without father.” The sermons of chapter 4 say the Devil God “was cast into the outer darkness, of a Mother's mistake, unwanted and deformed; he could barely even remember.”"}, {"t": "Wisdom of all", "ch": "31", "x": "When Samson asks the hanging shadow who Wisdom of all is, Wisdom of Limbo answers: “Sophia is the mother of the devil-God Yaldabaoth, and she is the one who is the form of Wisdom.” He adds that Samson is closer to life in asking it."}], "notes": ["Note: unofficially, Sophia comes from the Fullness."]}, {"id": "spirit", "name": "The Spirit of Life", "cat": "Powers and fates", "ch": "33", "lead": "A bright spirit that roams outside every realm, even the outer darkness.", "forms": [{"t": "Tree I: Life", "ch": "33", "x": "The spirit roams free, outside Limbo, the material world, the stars and planets, and even outside the outer darkness. It shines in the darkness, “seeing the truth of the realms,” and swims up through the abyss to a place above all of it, wanting to be heard: “We are the same!” Its next saying, “Either sleeping or waking, come to life and see,” shakes every world. Snakes hide beneath rocks, the Leviathan shudders, and the Yaldabaoth runs from it and trips into the outermost moat. Unable to become full without love, the spirit descends again toward the knocks and whispers it has heard: “Life returns to the dead home, searching for the sleeper caught in between.”"}], "notes": []}, {"id": "koah", "name": "Kōaḥ", "cat": "Powers and fates", "ch": "2, 4, 18, 19", "lead": "The soothsaying voice of dice and numbers.", "forms": [{"t": "Ten: I", "ch": "2", "x": "The second chapter carries the name kōaḥ and is signed with it. It is a voice of dice, numbers and flames: “Follow me tonight, listen to me,” “Shake dice below the lapping flames of my hunger,” “Twenty-eight rolls the dice,” and at the end, “I'll be there waiting.”"}, {"t": "The passage", "ch": "4", "x": "At the end of the shoreline sermons the speaker says, “We no longer need journey through the carrion passing of Kōaḥ's passage.”"}, {"t": "The magician", "ch": "18", "x": "At the desert rite, a long speech of numbers (the thirteenth age of twelve, the sixteenth bondage, “six-sixes reversing”) is “shown in the soul, by the form of the magician, kōaḥ.” Later in the same chapter the soothsaying of kōaḥ is listed among all that speaks to the boy."}, {"t": "The pleasure", "ch": "19", "x": "Under the tree of life, a voice from the night tells Samson that his battle is “foretold in my soothsayings” and that “it is the pleasure of kōaḥ that you kill the Leviathan.”"}], "notes": ["Note: clarity as madness."]}, {"id": "crab", "name": "The Woman with Crab Claws", "cat": "Powers and fates", "ch": "19, 20, 36", "lead": "A woman of shadow who stands on the moon and weaves.", "forms": [{"t": "On the moon", "ch": "19", "x": "Past the portal, the moon serves as a stepping stool for a woman's shadow, “who weaves fabrics out of the clouds as creation; her weaving is with claws of a crab on a human shape.” The tree sews its heart into the fabric of the clouds, and she speaks last: Leviathan's corpse will litter the heavens, “and Tartarus will celebrate this castration of the dark oceans, which frees both Adam and Eve from the past.”"}, {"t": "Breath over the shore", "ch": "20", "x": "Before the battle, “the pneuma of the shadowy woman with claws of a crab from the moon blows, her voice heard in the soul by those who can hear, a breath without a mouth,” and the sea begins to turn."}, {"t": "Sewing words", "ch": "36", "x": "Words are sewn from the moon “by a woman of shadow with crabs claws, her fabric woven into the ground of the heavens,” and the memories speak into Yaldabaoth's sanity: “You and your false angels are as pawns, your will unto these two you bless is against your own.”"}], "notes": ["Echoes, not named as her: “she sews the words of fate into being” (13); “sewn by the fullness from the moon” (17); “the night sewing of clouds” (22)."]}, {"id": "archons", "name": "The Archons", "cat": "Powers and fates", "ch": "10, 11, 13, 18", "lead": "Rulers of the stars of the material heaven.", "forms": [{"t": "The stars", "ch": "10", "x": "The true angels hang by the spine from “the archons' stars.” When Antony climbs among them, “they do not attempt to bind him; not even one dares.” After his wound, the archons question the place of the demiurge, confused."}, {"t": "Betrayal and cells", "ch": "11, 13", "x": "In Thomas's storm the sun falls from the sky, “shot down by an Archon's fired betrayal” (11). The angry God brings hearts “into confines of the Archonic cell plans” (13)."}, {"t": "At the rite", "ch": "18", "x": "“The archons glow in the night in solidarity,” and the archons “of the glowing throughout the cloud-covered desert night” are among all that speaks to the boy."}], "notes": []}, {"id": "titans", "name": "The Three Titans", "cat": "Powers and fates", "ch": "36", "lead": "Watchers of the first moat, covered in eyes.", "forms": [{"t": "The watch", "ch": "36", "x": "Through the first moat Yaldabaoth finds towering titans with eyes between every slit of muscle fiber: three of them, twelve times taller than himself, each covered in seven hundred and seventy-seven eyes. Their purpose, says the one on the right, is “To see it through.” The center one judges: “We watch your pride unfold from your impurity for thirteen infinitudes.” The leftmost adds that his third mistake will be his last, every time. Yaldabaoth grows over them, and his shadow swallows them whole, their souls consumed. Later, sinking in the tar, he finds that not even the titans can save him, “for he swallowed their souls.”"}], "notes": []}, {"id": "yalda", "name": "Yaldabaoth", "cat": "The demiurge", "ch": "4, 10, 13, 17, 18, 21, 25, 31, 33, 36", "lead": "The lion-headed serpent creator: the demiurge, the Devil God, the False-God.", "forms": [{"t": "The Devil God of the dead home", "ch": "4, 13, 17", "x": "The sermons of chapter 4 say he was cast into the outer darkness, “of a Mother's mistake, unwanted and deformed.” His dying memory spews corruption onto the material plane, “this being his creation.” He calls himself the first and only God, and “this Demon God has fashioned your dream, your dead home.” Chapter 13 speaks of a raging God and hateful father who traps nameless souls in a tangled world, and of “the curseful chains from the demiurge,” “called devil-god by some.” Chapter 17 speaks to him directly: he eats the stars and himself, vomits and eats his vomit again, and fashions “a dead home made of dead memories,” until it names him: “Yaldabaoth: the ideal of imperfection.”"}, {"t": "In his heaven", "ch": "10", "x": "Antony reaches “the gates of the Devil-God” and calls him “Demiurge of sixteen lies.” The demiurge flees on his slithering tail and is dragged back by it; his lion head shows as he hisses “like a child caught wrong.” Antony's spear splits the end of his tongue, “where serpents will be cursed with the opened front half of this mouth muscle.” He hides in shame in his own coils while “another below the demiurge,” Satan, attacks the angel."}, {"t": "At the rite", "ch": "18", "x": "“Drop the seed, plant the seed of Antichrist,” speaks the demiurge, listed among the voices as “the Demiurge as a Devil-God serpent creator.”"}, {"t": "Poured and betrayed", "ch": "21, 25, 31", "x": "Leviathan pours out the demiurge and Ouroboros “as clay cups,” and the demiurge “will stumble into three times” the nothingness moat before surrendering (21). The good puppet announces, “Yaldabaoth is betrayed” (25). Wisdom of Limbo calls him “the devil-God Yaldabaoth,” Sophia's son (31)."}, {"t": "Fleeing life", "ch": "33", "x": "At the spirit's saying, the Yaldabaoth runs, “trying to find life in their ignorance,” trips into the outermost moat, and finds no life there to consume, “only the nothingness swallowing his imperfect flame.” Saturn's rings hide on the seventh day in homage to “the suffering of its God.”"}, {"t": "Crossing the moats", "ch": "36", "x": "Advised by 361 demons, he bridges the scalding river with his own angels, swallows the souls of the titans, tears the Sun from the sky and loses it in the tar, and nearly drowns. Lucifer, as a flying angel doll, pulls him out with a ladder made of a word in exchange for a realm of his own. Home again, he spits out a second Sun, breathes out the star Redemption, casts Curse down, and at last curses Lucifer and Ouroboros: “You and your brother are delusion kind.”"}], "notes": []}, {"id": "leviathan", "name": "Leviathan", "cat": "Serpents and demons", "ch": "1, 4, 6, 10, 18, 19, 20, 21, 22, 23, 33, 36", "lead": "The serpent of the sea who became the nothingness of the outer darkness.", "forms": [{"t": "The voice of the dead home", "ch": "1", "x": "“The leviathan told me, ‘I need something made of you.’” The voice is pulled into a blackened heat and fed ignorance."}, {"t": "The sea serpent", "ch": "10, 19, 20", "x": "Antony's head sinks “into the abyss of Leviathan's ocean” (10). The voice under the tree of life calls for Leviathan's death so that “his soul will be cast into the outer darkness, a new home for the beast” (19). At the north shore he rises out of a whirlpool, hissing in “a choir of dying engines,” his teeth taller than any structure. His form is “the prime evil form of empty darkness, bondage, hell, exile, and chaos”; his temperament is cold and dry. Samson cuts and shoots him; Antony's lightning splits his tongue down to the throat, strikes him one hundred and fifty-seven times, and drives a length of his own spine into his eye (20)."}, {"t": "Snake on the moon", "ch": "18", "x": "At the desert rite, “Leviathan slips something into the drink of sand; memories of memories,” “constricting a shadow on the moon above.” The rite names “Leviathan as Snake on the moon.”"}, {"t": "The nothingness", "ch": "20, 21, 23", "x": "After his death he roams “the outer darkness of the Kenoma,” a prison worse than the demiurge's bondage that “encircles even the heavens and the skies” (20). He pours out the demiurge and Ouroboros like clay cups and is given “keys of providence in this nothingness moat.” He whispers into the ears of Kether and Satan: “I am the nothingness you can never hear and have never heard … my only match is the fullness I fell from with purpose” (21). He holds Satan and every soul in their toys: “You will know nothing” (23)."}, {"t": "In Kether's hallway", "ch": "22", "x": "Kether's chest opens with teeth like Leviathan's, and Lucifer squeezes the heart “between the mouth of Leviathan.” Antony's lightning explodes Leviathan's throat. At the end, “the moon is knocked out of the sky by Leviathan.”"}, {"t": "Elsewhere", "ch": "4, 6, 33, 36", "x": "“I see past the Leviathan” (4). The rabbit-masked father is caught “in leviathan's choke-fingered grip” (6). The Leviathan shudders at the spirit of life (33). Yaldabaoth boasts, “I fashioned the Leviathan” (36)."}], "notes": ["Note: the outer darkness is made of the shadow of Leviathan."]}, {"id": "ouroboros", "name": "Ouroboros", "cat": "Serpents and demons", "ch": "4, 6, 18, 21, 22, 23, 25, 36, 38, 41", "lead": "The serpent that consumes itself; Lucifer's brother.", "forms": [{"t": "The self-eater", "ch": "18, 21", "x": "At the rite, “the Ouroboros slither who consumes themselves endlessly” speaks by way of gut movements: “Return to your folly here again and consume; it is your vomit and tail of your soul's future and end together. You will never begin but always end” (18). Poured out by Leviathan, “Ouroboros consumes only itself, a chaos journey inward, likened unto the demiurge's creation” (21)."}, {"t": "The dream", "ch": "4, 22, 23", "x": "“Now I am freed of an anaconda's ouroboros dream, the nothingness of a black serpent” (4). Kether's dreams reach “the dreamscape of the ouroboros” (22). The stairs of the outer darkness mock “the dreams of ouroboros” (23)."}, {"t": "The fangs", "ch": "6", "x": "The rabbit-masked father is struck by “the spring fangs of ouroboros.”"}, {"t": "The copy", "ch": "25", "x": "The one who stomps his copy says, “The himself who stomps on his tail by teeth is repeating itself,” and Lucifer tells the copy, “I hate you, ouroboros.”"}, {"t": "The brother", "ch": "36, 38, 41", "x": "Lucifer's logic is to be written “with the ink of the snake's fang, from your brother Ouroboros.” Cursed as “delusion kind,” the brothers are cast down, and Lucifer swallows Ouroboros to protect him from the fall (36). On the clowns' stretcher he lies paralyzed until he laughs, “I hate God!” and “I fucking hate you, Lucifer!” (38). Lucifer feeds him the world that fell out of his head: “Oh, yeah, I am just an analogy being read” (41)."}], "notes": ["Note: the chaos of nous, introverted."]}, {"id": "lucifer", "name": "Lucifer", "cat": "Serpents and demons", "ch": "6, 14, 16, 18, 21, 22, 25, 34, 36, 38, 41", "lead": "A brother and a deceiver, who takes many forms.", "forms": [{"t": "The brother", "ch": "14", "x": "In the Hermit's vision a teary brother approaches: “I love you, brother.” The brothers hold each other, “Lucifer forgiven forever—” and the vision breaks. Lucifer is then sitting on the Hermit's heart, yelling, “Repeating! Repeating!” and at the end whispers, “You are God; there is nothing else.”"}, {"t": "Of lies, in the heart", "ch": "6, 16, 18, 21", "x": "A grip is “familiar to the Lucifer” (6). Kether's pride “puts Lucifer himself to shame” (16). At the rite, “speaks the Lucifer, who holds his heart with déjà vu weight”: “Spit the burning flashes of your sixteen; you will culminate in a new form of pride.” He is “the Lucifer of lies in his heart” (18). “The image of Lucifer in the fluid reflection” (21)."}, {"t": "Holding the heart", "ch": "22, 25", "x": "In Kether's chest, Lucifer squeezes the heart with madness until threads undo his claws and arm like fabric (22). “Lucifer is holding your heart from within”; he tells the good puppet, “You are God” (25)."}, {"t": "The man in the hoard", "ch": "34", "x": "“Hey, Lucifer!” A man buried in his hoard stops when he hears his name, “unfamiliar now.”"}, {"t": "The angel doll with bleeding eyes", "ch": "36", "x": "“One does come by, the flying doll in the form of an angel, its eyes bleeding out of its tear ducts.” Lucifer answers in his new form, “For what price?” and lifts Yaldabaoth out of the tar with a ladder made of the word “Ladder.” He is promised words written into worlds and an apocryphon, then cursed and cast down with Ouroboros, whom he swallows."}, {"t": "The clown", "ch": "38", "x": "One perverted clown kisses and licks the paralyzed man, then says, “Imagine this is a joke. Wouldn't that be funny, Ouroboros?” Lucifer laughs with his brother, “I hate you too, brother!” and learns from another clown that they are only words on a papyrus."}, {"t": "The writer's voice", "ch": "41", "x": "“Lucifer has me write this to say his voice”: “Why would I eat my words, then? I think you took too much Ouroboros.”"}], "notes": ["Note: delusion and pride; extroverted psychosis.", "Note: Lucifer is the Antichrist when in the form of the angel doll with the bleeding eyes.", "Lucifer and Satan are different beings."]}, {"id": "satan", "name": "Satan", "cat": "Serpents and demons", "ch": "6, 10, 18, 20, 21, 22, 23, 29, 41", "lead": "A violent demon, possessor and prisoner.", "forms": [{"t": "Below the demiurge", "ch": "10", "x": "“Another below the demiurge nearby draws in, and his name is Satan.” He tackles Antony out of the delusion lands, screams “I am promise of violence!”, tears off his wings and his head: “Nothing ever was, Antony.”"}, {"t": "The possessor", "ch": "6, 18, 20", "x": "“This is wrestling with Satan” (6). The boy at the rite is Christopher, “his soul possessing his soul named Satan” (18). On the shore, Samson sees a yellow hallway and kicks at teeth that grab: “A feral brother possesses him. Satan.” Antony casts out “familiar Satan by the power of the fullness” (20)."}, {"t": "The whisperer", "ch": "21, 22", "x": "Leviathan whispers into his ear (21). He whispers to Kether, “This is all there is,” and Antony wrestles him under the tree of life and hangs him from it by two spines (22)."}, {"t": "The prisoner", "ch": "23", "x": "In the outer darkness the marionettes force him to eat his own rotted teeth while the boy in overalls holds his mouth open. He watches himself die through a puppet's pupil, cannot leave, and learns he has been held there for a span beyond counting: “You will know nothing.”"}, {"t": "Elsewhere", "ch": "29, 41", "x": "The goat-bull has “claws of hand like Satan” (29). “Didn't we one time write about Satan doing the same with his teeth?” (41)."}], "notes": ["Lucifer and Satan are different beings."]}, {"id": "anti", "name": "The Antichrist", "cat": "Serpents and demons", "ch": "7, 18, 28, 30, 34, 36", "lead": "A promise spoken over souls, and a baby angel doll that weeps blood.", "forms": [{"t": "The promise", "ch": "7, 18", "x": "“A snake whisper crawled legless across my hospital bed and next to the ear, where the slithering tongue promised me as antichrist” (7). At the rite: “Drop the seed, plant the seed of Antichrist,” speaks the demiurge (18)."}, {"t": "The baby angel doll", "ch": "28, 30, 34", "x": "Spirits tell a mother “the Antichrist's soul is condemned in the floorboards now,” and she says, “I become the Antichrist by doing this.” A porcelain baby hangs by a single string, dressed in white wings, crying “bloody lamb tears” (28). A baby doll with angel wings, crying blood, unrolls the circus banner “Toll of a Tree: Death!” (30). A baby doll in angel wings hangs from the ceiling bleeding tears over a scroll that reads “I am the Antichrist” (34)."}, {"t": "Lucifer's new form", "ch": "36", "x": "The flying doll in the form of an angel, its eyes bleeding, is Lucifer “in his new form.”"}], "notes": ["Note: Lucifer is the Antichrist when in the form of the angel doll with the bleeding eyes."]}, {"id": "demons", "name": "Demons", "cat": "Serpents and demons", "ch": "4, 6, 10, 33, 36", "lead": "Souls grown sick in their lostness.", "forms": [{"t": "The sick", "ch": "4", "x": "“Sons and daughters of our family tree blindly spill forth their emptying seeds, growing lostness; some become deeply sick therein, and these are the demons.” Some serve Demon Fathers and Mothers, some pleasure, some pride, and some hatred and blasphemy. “These tortured ones rule the outer darkness, of which is your Devil God.”"}, {"t": "Possessors", "ch": "6, 10", "x": "“This demon knew the suffering from God's hatred unto themselves, having lived it forever” (6). Under the stars, “the demons possess and stoke the burning joy of human cackles,” and demonic spirits hold the calves of the restless angel (10)."}, {"t": "Council and infestation", "ch": "33, 36", "x": "“Many demons search for life, but their idea of it is blind” (33). “Whispering councils of three hundred and sixty-one demons” tell the demiurge to bridge the river; later he cries, “The demons have infested our home!” (36)."}], "notes": []}, {"id": "goatbull", "name": "The Goat-Bull Devil", "cat": "Serpents and demons", "ch": "29, 30", "lead": "Guardian of the gate of the black joker.", "forms": [{"t": "At the gate", "ch": "29", "x": "Over seven feet tall, hooved, with horns like a goat, claws like Satan, black wings at rest, piercings, and the head of a strong bull. It beats Samson beside the pond and stamps on his chest until Samson pulls a spine from the water, spits blood on it, and drives it through the beast's sternum."}, {"t": "Remembered", "ch": "30", "x": "The Fool tells Alice, “He killed my devil friend at the gate as well!”"}], "notes": ["Note: a guardian demon."]}, {"id": "bull", "name": "The Bull with a Goat's Head", "cat": "Serpents and demons", "ch": "30", "lead": "The beast of the Fool's circus.", "forms": [{"t": "In the tent", "ch": "30", "x": "Walking on all fours, held by eight small boy puppets on sixteen ropes, it smells of wet fur. Riled by the pelting, it breaks loose, flings the dolls into the air, and tramples Alice."}], "notes": []}, {"id": "antony", "name": "Antony", "cat": "Angels", "ch": "5, 10, 19, 20, 22, 23, 32, 33, 34, 37", "lead": "Guardian angel: a restless angel, a machine, a heart and a judge.", "forms": [{"t": "The angel machine", "ch": "5, 32, 34", "x": "An angel “looks down from its porcelain-cracked white smile mask,” hanging from the wires and pumps of a wall crucifix in a stone chamber, its eyes rolling with the sound of dry gears. It counts backward in a cackling analog tenor and glitches as it warns: “Christopher! You must go back!” and “Christopher, the fallen one, return” (5). It pleads with Kether in a dream, “Every repeat is eternal, but in each is a chance!” (32), and cries that a demon is there in the chamber (34)."}, {"t": "The restless angel", "ch": "10", "x": "Among the angels hung by the spine from the stars, “there is one who does not sit still.” He climbs the spine-rope through the clouds and the archons to the gates of the demiurge, rips his spine from his neck as a spear, and splits the serpent's tongue. Satan tears off his wings and head, which falls into Leviathan's ocean. “He will be made again.”"}, {"t": "The heart", "ch": "19", "x": "Pulled from the oceans without wings, with serpent's eyes, he tells the Euclids of Tartarus and of “the sleeping-demi-God rising,” the half of himself he must save. Lodged in a crystal in Samson's new heart, he tells Samson, “I am the half that watched.”"}, {"t": "The judge", "ch": "20", "x": "His screams become lightning through Leviathan's mouth. When Samson dies on the shore, Antony's wings re-form from the wreck. He strikes the serpent one hundred and fifty-seven times, tears out a length of its spine, and drives it into its eye. His form is “primordial, made of judgement, time, protection, responsibility, and endurance.”"}, {"t": "On the crucifix", "ch": "22", "x": "Hung and butchered by Kether, his heart keeps beating: “I share no house with the ancient poison.” He then wrestles Satan under the tree of life, puts three swords through Kether's heart, and hangs Satan from the tree with two spines."}, {"t": "Remembered", "ch": "23, 33, 37", "x": "The boy doll's voice is “the mockery of his murderer, Antony” (23). “The guardian angel knows this” (33). Alice feels Antony watching and knows his name (37)."}], "notes": []}, {"id": "truea", "name": "The True Angels", "cat": "Angels", "ch": "4, 10", "lead": "Angels hung by the spine from the stars.", "forms": [{"t": "Hung from the stars", "ch": "10", "x": "“They hang by the spine from stars”: angels whose souls outreach the lights of the archons' stars, hanging spine-first over ancients who dance in masks at their stones. Where they hang by the spine from open neck wounds, “their sparks quiet for another time, like sleeping giants. Many are waiting their dignities to return, after however many eternities in the snake pit; praying.” The chapter asks whether they were “mimicked three hundred and sixty-five times,” the heaven-sent kinds apart from the mimicked ones. One of them, Antony, does not sit still."}, {"t": "Messengers", "ch": "4", "x": "“You have angels amongst you. You are safe for now.” They will help guide the lost home “if you trust their mercy and love.” “Angels pour forth for the will of the unseen, but were a once-seen holy reality.” Some deviated from “those sent, messengers.”"}], "notes": ["Note: the angels hanging from the stars are true angels, from the Fullness, distinct from the false angels of the demiurge."]}, {"id": "falsea", "name": "The False Angels", "cat": "Angels", "ch": "36", "lead": "The demiurge's own three hundred and sixty-one angels.", "forms": [{"t": "The bridge", "ch": "36", "x": "Yaldabaoth yanks his angels through a portal “like rope clogging a pipe.” They try to fly, to run, to plead in “their corrupted seraphic tears.” He tears their wings, boils their bones, sews their eyes and mouths shut, and binds their hands and feet into a hanging bridge, thanking them twice before slithering across their squirms. When he sinks in the tar they cannot answer him."}, {"t": "Redemption", "ch": "36", "x": "Home again, Yaldabaoth breathes out the star Redemption to heal any of his three hundred and sixty-one angels who forgive themselves. Three hundred and sixty are healed: stitches undone, bones strengthened, wings sutured and blessed into flesh. The woman of shadow tells him, “You and your false angels are as pawns.”"}], "notes": ["Note: distinct from the true angels who hang by their spines from the stars."]}, {"id": "curse", "name": "Curse", "cat": "Angels", "ch": "36", "lead": "The one angel who refuses Redemption.", "forms": [{"t": "The fall", "ch": "36", "x": "The one angel who denies Redemption's aid “is the most able to forgive himself,” but he is left wingless and broken, hating the demiurge and his creation and feeling betrayed. Cast out of Heaven, “his name is Curse,” thrown into the dirt of humankind like a meteor; “a nightfall lit up by an angel fall.”"}], "notes": []}, {"id": "wired", "name": "The Wired Angels", "cat": "Angels", "ch": "7, 15", "lead": "Angels of metal, wires and drives.", "forms": [{"t": "Over the towers", "ch": "7", "x": "Winged angels with “metal below the ear and inside the neck” watch people in their cubicle shelters in towers risen from no ground. They wake the narrator, glowing and beeping a forgotten pattern, and slide a drive behind the narrator's ear “like a slit of a lock.”"}, {"t": "On the battlefield", "ch": "15", "x": "“A fallen angel maybe,” almost seven feet tall in black armor with a plasma spear, leads a squadron against Samson. Black-winged, it crawls over his mech like a spider, shows a deformed face of many mandibles, and pulls the memory chip from the back of his neck. Samson calls it a demon."}], "notes": []}, {"id": "puppets", "name": "The Puppets and Marionettes", "cat": "Puppets, dolls and shadows", "ch": "3, 4, 9, 18, 20, 22, 23, 24, 30, 34, 35, 36", "lead": "Smiling figures on strings, in many places and forms.", "forms": [{"t": "In the outer darkness", "ch": "20, 23", "x": "On Samson's dying vision, puppets march on playground-colored stairs that defy gravity, “their broken puppet smiles and skin reflecting hell-sweat down plastic and porcelain cheeks, some rosy, some dimpled, some freckled,” begging for the death they live in (20). In Satan's room, a marigold round of marionette heads sings “Row, row, row your boat” with guns to the backs of their heads, rewinds like a tape, works in a workshop “like elves busy with nothing,” then forces Satan to eat his own teeth. Their hair is painted on, their eyes porcelain, their dress shoes treadless; “Where Satan lies is just one little room of this infinitude hotel of puppet machines” (23)."}, {"t": "The doll in the bedroom", "ch": "24", "x": "A porcelain doll clicks lifelessly at Alice's window, then seems to be only in her painting, then, while a tape's tenor-squeal sings “Row, row, row your boat” in the dark, is less than an inch from her eye, and at last sits straight on her bed under the light: “Why don't we talk about Christopher?” It points to the painting she made of it."}, {"t": "The circus crowd", "ch": "30", "x": "Puppets smile from tiered benches in early twentieth-century dress, “all looking like children,” smelling of paint and varnish. Musicians in white with red stripes mimic horns and drums. A dummy hands out a sack, and they pelt Alice with beating hearts. Eight small boy puppets drag the bull in on sixteen ropes."}, {"t": "On the piano", "ch": "35", "x": "In the antique shop: “the antique dolls painted with thin legs and long horn shoes, smiling away. They sit in columns and rows over the old piano in one corner,” beneath the jester painting by Alice Love."}, {"t": "In the hoard", "ch": "34", "x": "“Wee little puppets go in and out of mouse holes, like doors,” and small woodworkers with tiny hammers crawl over the man like a second Earth."}, {"t": "As a word", "ch": "3, 4, 9, 18, 22, 36", "x": "“Hollow marionette, I will remember the toll of your lifeless clicks” (3). “A puppet of puppets, marionettes of marionettes” (4, 36). “I'm a good puppet” (9). “The end is filled with puppets playing with themselves” (18). Kether falls “like a bad puppet” off the strings (22)."}], "notes": ["Note: the puppets and the playground stairs live inside the outer darkness."]}, {"id": "toys", "name": "Puppet Toys", "cat": "Puppets, dolls and shadows", "ch": "23, 28, 30, 34, 35", "lead": "Toys that hold souls, mimic children, or guard a hoard.", "forms": [{"t": "Souls in toys", "ch": "23", "x": "The marionettes sit “impaled on little sticks like toys,” work “with toy hammers without choice,” and caress Satan's hair as little toys. “Leviathan forces this unto every soul trapped within their toys.” The boy doll who feeds Satan is “the toy boy.”"}, {"t": "The angel toy", "ch": "28", "x": "A porcelain baby hangs by a single string with eyes that shine empty: “The angel toy looks just like her son, dressed in white wings.” When God cuts the strings, the doll thuds to the ground."}, {"t": "Boys and girls of the stands", "ch": "30", "x": "“These little toys of boys and girls are adorned in the classical formal attire of the early twentieth century,” the dead stares of “the toys in their seats.”"}, {"t": "The shop's toys", "ch": "35", "x": "A miniature train rests on tiny railroads before metal cups of pearl necklaces and marbles; pocket-sized toy soldiers in red coats, “little nutcrackers,” stand at the ends of the table “almost guarding the mounds.” Above the piano sit “the tiny toys of boys and girls.”"}, {"t": "The collected", "ch": "34", "x": "“His lies are built by bitty nothing toys he collected, towering around him in his room.”"}], "notes": []}, {"id": "golden", "name": "The Good Puppet · Golden Child", "cat": "Puppets, dolls and shadows", "ch": "9, 25, 34", "lead": "A man with a pink television, painted in gold.", "forms": [{"t": "Good Puppet", "ch": "9", "x": "In an abandoned room, a thirty-year-old man keeps his hand on a fuzzy pink television and talks to God: “You want me to? Okay, I'll listen, God.” He smacks his head on the counter, hears ringing, and wonders where she is. The phone rings, and the pain makes him smile “like a good puppet. I'm a good puppet. I hope I am dead.”"}, {"t": "Golden Child", "ch": "25", "x": "Gold covers an earlier silver across a face breathing through a bag. A chosen one stomps on his copy, screaming “Say God!” When the image shatters like a television, a good puppet stands covered in gold at a broken pink television: “Yaldabaoth is betrayed.” Lucifer tells him, “You are God.” Bald in gold, he kicks his smiling copy, then sits against a tree as a puppet boy in overalls swings and tells him, “Lucifer, you're stupid,” and he laughs in disbelief."}, {"t": "Thistle Rope", "ch": "34", "x": "A bald man of forty-three, wrapped in wires in a room hoarded with childhood memories, drags a pink television by its cord, babbles at the shadows, and is buried by his own clutter. A voice calls “Hey, Lucifer!” and he stops at his name. He sees a baby doll with angel wings bleeding tears and a scroll: “I am the Antichrist.” He wakes on a cold floor before the raised stone and the machine angel, who calls him Christopher."}], "notes": ["Note: the man in Thistle Rope is the Good Puppet and the Golden Child."]}, {"id": "rosy", "name": "The Boy in Overalls", "cat": "Puppets, dolls and shadows", "ch": "23, 25, 42", "lead": "A porcelain boy with black hair and rosy cheeks.", "forms": [{"t": "The feeder", "ch": "23", "x": "“This dark-haired porcelain boy in overalls, with rosy cheeks” pries Satan's teeth apart with tiny fake fingers and scoops the fleshy gum-teeth from the carpet into his mouth: “Eat the can—can—candy!” His grin stretches until it hurts to look at. Satan recognizes the voice as “the mockery of his murderer, Antony.” Through the boy's pupil, Satan watches his own death."}, {"t": "On the swing", "ch": "25", "x": "“A toy or puppet of a boy is swinging in overalls” on the tire swing of a childhood tree. “His fake voice cassette tells him, ‘Lucifer, you're stupid.’”"}, {"t": "A flash", "ch": "42", "x": "Damon remembers “being forcefully fed gummy flesh like teeth by the rosy cheek puppet in overalls.”"}], "notes": []}, {"id": "opi", "name": "Opi and Noidy", "cat": "Puppets, dolls and shadows", "ch": "11, 35", "lead": "Two button-eyed stuffed dolls with yarn hair.", "forms": [{"t": "On the table", "ch": "11", "x": "“Opi with Noidy, the two button-eye stuff-stitch friends holding one another,” in yarn hair and crochet clothes. Black-haired Opi and red-haired Noidy sit among dice, rune books and scribbles. Under Noidy's shirt Thomas finds a red wax seal, “like a letter, but of a necromantic kind.”"}, {"t": "The red house", "ch": "11", "x": "In the red house hangs a picture of little Noidy in a corner. In the box of mirrors a little black-haired one runs through the reflections, and another doll of red yarn falls over weeping; the weeping of Thomas's wife comes from “the doll lying on the table.” At the end, “Noidy, stuck inside without Opi. Cannot leave.”"}, {"t": "In the shop", "ch": "35", "x": "Not named in chapter 35: two dolls with button eyes and yarn hair, one red-haired and one black-haired, sit in front of a small red house across the piano."}], "notes": []}, {"id": "clowns", "name": "The Clowns", "cat": "Puppets, dolls and shadows", "ch": "38", "lead": "Clowns who take a paralyzed man.", "forms": [{"t": "Joy & Pleasure", "ch": "38", "x": "Clowns wrap around a paralyzed man and wheel him on a white stretcher dotted blue, red and yellow. One with goat eyes and slit pupils kisses him with perverse love; others joke about the last kidnapping. They cut blue worms from under his skin and eat them like noodles, and one strangles another for the longest worm. When the man laughs, “I hate God!”, they all laugh with him, until one points to the edge of the papyrus they are written on: “Just words is all, see?”"}], "notes": []}, {"id": "shadows", "name": "Shadow Figures", "cat": "Puppets, dolls and shadows", "ch": "18, 19, 22, 29, 31, 34", "lead": "Shadows that speak, mutter, hang and weave.", "forms": [{"t": "Shadow people of the hoard", "ch": "34", "x": "“Shadows across the walls mutter a name without noise,” repeating it. One black shadow rolls its hands around itself; one kicks the garbage pile over onto the man; “one of the shadow people on the wall” says, “I been wanting to tell you something.”"}, {"t": "The crimson hallway", "ch": "22", "x": "Moonlight breaks into Kether's hall, “black shadows of many forms rising at the walls, up and down like waves,” and “the shadow of a crab runs up the wall quickly, like a spider.”"}, {"t": "The hangman", "ch": "31", "x": "A shadow hangs upside down from the tree of both life and death, skinny, with a pointed hat. It names itself Wisdom of Limbo."}, {"t": "On the moon", "ch": "18, 19", "x": "Leviathan constricts “a shadow on the moon above” (18). A woman's shadow uses the moon as a stepping stool and weaves with crab claws (19)."}, {"t": "In the water", "ch": "29", "x": "Samson's reflection in the fountain is “a form unseen, blotted out by a shadow not himself.”"}], "notes": ["Note: the outer darkness itself is made of the shadow of Leviathan."]}, {"id": "chin", "name": "The Long Chin Shadow", "cat": "Puppets, dolls and shadows", "ch": "11, 18, 22", "lead": "A whispering shadow with a long, pointed chin.", "forms": [{"t": "The dark one", "ch": "11", "x": "“The dark, shadowy chin point; he leans in”: it whispers to Thomas, “You will take a life then.” After the shot it says, “She did this, but she is a memory,” whispers as he walks to the red house, and asks, “Do you see the memories?” In the end it grabs at everyone in the dark."}, {"t": "At the rite", "ch": "18", "x": "“Don't ignore the presence; keep it close,” says a long chin shadow, listed as “a shadow chin darkness as Virgil guidance often unseen.”"}, {"t": "Over Kether's neck", "ch": "22", "x": "“The darkness of a chin shadow stretches across the wall, cold at the back of his neck”: “The chase is the rabbit chased … Do you really think you should not run from that which terrifies you, rabbit?”"}], "notes": []}, {"id": "fool", "name": "The Fool", "cat": "Limbo", "ch": "26, 30, 31, 35", "lead": "A long-nosed Jester of Limbo.", "forms": [{"t": "On his tree", "ch": "26", "x": "In black-and-white stripes with red points and two golden buttons, skin like baking bread and a nose that hangs like a rope, he lounges on the single dead tree of his realm. He sniffs Samson, eats a queen of hearts and chews a deck of cards, counts jokers in impossible numbers, and calls himself Fool. Samson chops the tree down; “My first ever tree in this realm! Given by God!”"}, {"t": "Ringmaster", "ch": "30", "x": "He descends into his circus tent on an enormous fish hook playing accordion, a third arm sprouting from his back. He smells “an Alice,” tells her that her lover cut down his tree, has the dolls pelt her with hearts, and screams for the bull to murder her."}, {"t": "Relations", "ch": "31", "x": "Wisdom of Limbo calls himself “a fool's relation,” the lesson learned born of foolishness, and so the son of a fool."}, {"t": "The painting", "ch": "35", "x": "Sarah's painting shows a white-faced jester in black and white, with yellow buttons and a long drooping nose, on a dry old tree over a green field and a pure black sky."}], "notes": []}, {"id": "wisdom", "name": "Wisdom of Limbo", "cat": "Limbo", "ch": "31", "lead": "The hanging shadow on the tree of both life and death.", "forms": [{"t": "The hangman", "ch": "31", "x": "“Wisdom of the first of third Limbo” hangs upside down from the tree of both life and death and smells “a waking God made of Mars.” He asks for the mind as a toll, explains the curse of the joker brought by cutting the Fool's tree, tells Samson he is the waking God and his half the sleeping God, and names Sophia as the form of Wisdom. “I am the both of both, and my duty is unto the fullness.”"}], "notes": []}, {"id": "christopher", "name": "Christopher", "cat": "Souls and wanderers", "ch": "5, 18, 24, 26, 30, 34, 37, 42", "lead": "A man in the stone chamber, caught in the maiden.", "forms": [{"t": "The stone chamber", "ch": "5", "x": "“Born today: Christopher.” Waking in withdrawal on a raised stone under the angel machine, he pulls out his needles and walks into the maiden of wires and gas, “his blindfold.” A woman combs his hair and begs him to come back; he mouths “Go away, Antony.” The maiden spills him out pockmarked and burned: “I CANNOT TRUST!”"}, {"t": "The rite", "ch": "18", "x": "The boy at the desert rite is named: “The boy named Christopher, his soul possessing his soul named Satan.” He drinks the end, sees “a brother and a lover as one,” swears to kill the brother, and cannot see the lover past an angel in every vision."}, {"t": "Named elsewhere", "ch": "24, 26, 30, 42", "x": "His name comes to Alice's mind in her bedroom (24). The Fool smells “the lostness of Christopher” on Samson (26) and Christopher's scent on Alice (30). Damon hears a woman call “Christopher!” in a flash (42)."}, {"t": "Pulled out", "ch": "34, 37", "x": "He falls from the maiden onto the floor, crawling away from it, burned by the gas (34). Alice pulls him out, turns off the phone, and her tears wake him: “Alice…?” (37)."}], "notes": []}, {"id": "alice", "name": "Alice", "cat": "Souls and wanderers", "ch": "24, 30, 35, 37", "lead": "A painter, and Christopher's love.", "forms": [{"t": "The bedroom", "ch": "24", "x": "Alone at night with cubed paintings of marionettes and pastel angels on her walls, she is frozen by a clicking porcelain doll that moves between her window, her painting and her bed. It says, “Your love, he is free now,” and when the light cuts out a voice says, “I am the nothingness…”"}, {"t": "The circus", "ch": "30", "x": "Falling down a rabbit hole, she lands in the Fool's tent in a dark dress with yellow chaos stars, is pelted with beating hearts, and is trampled by the bull. She is found dead in her bed of heroin and PCP."}, {"t": "The painting", "ch": "35", "x": "The jester painting Sarah buys is signed “By Alice Love”; the shopkeeper says the painter recently passed away."}, {"t": "The stone chamber", "ch": "37", "x": "Inside the God Machine she finds the body, runs the stone corridors, opens the maiden, refuses the call from 25291791441265, and wakes Christopher with her tears: “I found you, love.”"}], "notes": ["Note: the woman in the bedroom in chapter 24 is Alice."]}, {"id": "samson", "name": "Samson", "cat": "Souls and wanderers", "ch": "15, 19, 20, 26, 29, 30, 31", "lead": "A soldier who becomes a traveler.", "forms": [{"t": "Tank Meat", "ch": "15", "x": "In a green mech over ten feet tall, he fights his way out of rubble and through a squadron. A black-winged angel pulls the memory chip from his neck: “She never was; they used me as a machine for war.”"}, {"t": "The heart", "ch": "19, 20", "x": "The Euclids of Binah give him a new heart with Antony in it. He climbs the mountain, enters the portal, and is sent to kill Leviathan. His form is “vitality, courage, and will,” hot and dry. He dies on the shore after the battle, seeing a feral brother and the marionettes."}, {"t": "The traveler", "ch": "26, 29, 31", "x": "Crossing Limbo, he chops down the Fool's tree (26), kills the goat-bull with a spine spear and finds the black joker lock (29), and hears from Wisdom that he is the waking God and that his love lies in the outermost realm (31)."}, {"t": "Named", "ch": "30", "x": "The Fool says Alice smells like Samson's and tells her that her lover cut down his tree."}], "notes": []}, {"id": "kether", "name": "Kether", "cat": "Souls and wanderers", "ch": "16, 18, 21, 22, 30, 32", "lead": "Leader of the Tiphareth Euclids, worshipped as a God.", "forms": [{"t": "The boy-God", "ch": "16", "x": "Eighteen, six-foot-two, with a long mouth and strong teeth; “a rising morning Venus,” called a fallen angel, with a pride that puts Lucifer to shame. His tribe trades in forbidden knowledge and drugs."}, {"t": "The chapter of the rite", "ch": "18", "x": "Chapter 18 bears his name: Kether: Meat Ends of Three Snakes. It follows a boy of sixteen and seventeen into the desert rite, where he is named Christopher, and where Satan, Leviathan, Lucifer, the long chin shadow, Ouroboros, kōaḥ, the Demiurge and the archons all speak."}, {"t": "Awake", "ch": "21, 22", "x": "Leviathan whispers into his ear (21). He hangs and butchers Antony, flees, falls “like a bad puppet” seeing a pink television, and is freed when Antony wrestles Satan: “Antony! I am awake!” (22)."}, {"t": "The dream", "ch": "32", "x": "From a stone bed full of needles he tells Antony the drugs are only an imitation and screams, “This is all there is!”"}], "notes": ["Note: Kether is connected to every figure named in chapter 18."]}, {"id": "hermit", "name": "The Hermit", "cat": "Souls and wanderers", "ch": "14", "lead": "A man who dies believing he is God.", "forms": [{"t": "Chemical Hermit", "ch": "14", "x": "He sees spirits around his table calling him the God and a heaven of his own making. A teary brother forgives him, then he is on a yellow-lit brown carpet with Lucifer on his heart. Blue at the hands and feet, he fights the brother who tries to help, wets himself, and hears, “You are God; there is nothing else.” His heart stops. “Back to sleep.”"}], "notes": []}, {"id": "thomas", "name": "Thomas", "cat": "Figures of single stories", "ch": "11", "lead": "A husband led by the dark one.", "forms": [{"t": "Thomas", "ch": "11", "x": "On a porch in the rain, the long-chinned dark one whispers to him. Inside, his wife Anna convulses after the dolls vanish, and he shoots her. He follows the shadow to a small red house, falls into a box of mirrors, loses his body among the reflections, and remembers Anna burying him in red wax under a new moon."}], "notes": []}, {"id": "anna", "name": "Anna", "cat": "Figures of single stories", "ch": "11", "lead": "Thomas's wife in a rabbit mask.", "forms": [{"t": "Anna", "ch": "11", "x": "In a scarlet silk dress and charcoal rabbit mask, she smokes beside Opi and Noidy and the rune books. The seal on Noidy is hers. She convulses in the flickering lights and is shot. Her weeping comes from the doll in the box of mirrors."}], "notes": []}, {"id": "boy6", "name": "The Hived Boy", "cat": "Figures of single stories", "ch": "6", "lead": "A sixteen-year-old covered in hives.", "forms": [{"t": "The Hived Boy", "ch": "6", "x": "Beaten by his rabbit-masked father, he is possessed and kills him. He wakes at dawn beside the body, covered in blood and hives, smiling by accident and knowing “something awakened for a night.”"}], "notes": []}, {"id": "rabbit", "name": "The Rabbit-Masked Father", "cat": "Figures of single stories", "ch": "6", "lead": "A father in a grey stone rabbit mask.", "forms": [{"t": "The Rabbit-Masked Father", "ch": "6", "x": "In a filthy vest he beats his son, “Why does the boy grow emptier!?”, and is killed by him: “The father murdered by his own son.”"}], "notes": []}, {"id": "mother", "name": "The Mother", "cat": "Figures of single stories", "ch": "28", "lead": "A mother in a bathroom with sirens outside.", "forms": [{"t": "The Mother", "ch": "28", "x": "The cradle is empty. She hears three spirits, says “I become the Antichrist by doing this,” and sees an angel doll that looks like her son, before God cuts the string over her."}], "notes": []}, {"id": "sarah", "name": "Sarah", "cat": "Figures of single stories", "ch": "35", "lead": "A buyer at the antique shop.", "forms": [{"t": "Sarah", "ch": "35", "x": "She buys the jester painting signed “By Alice Love” for twenty dollars and is given an unpriced VHS tape for free."}], "notes": []}, {"id": "louis", "name": "Louis", "cat": "Figures of single stories", "ch": "35", "lead": "The old shopkeeper.", "forms": [{"t": "Louis", "ch": "35", "x": "He kept too many things and learned to share them. He tells Sarah the painter recently passed away after selling him almost all her paintings."}], "notes": []}, {"id": "damon", "name": "Damon", "cat": "Figures of single stories", "ch": "42", "lead": "A man fighting his brother over pills.", "forms": [{"t": "Damon", "ch": "42", "x": "He bites off his brother's finger, beats and kisses him, shoots him, and hears his father on the line 25291791441265 tell him to take the pills. Flashes of a fight in the hallway, a fall through clouds, a puppet in overalls and a maiden come to him. His dead brother beats his face into the toilet."}], "notes": []}, {"id": "brother", "name": "Damon's Brother", "cat": "Figures of single stories", "ch": "42", "lead": "Damon's brother.", "forms": [{"t": "Damon's Brother", "ch": "42", "x": "He tries to take the pills, loses a finger, is shot with his phone dialed, and returns “riddled in a multitude of fatal gunshots” to stop Damon flushing them."}], "notes": []}, {"id": "father", "name": "The Father", "cat": "Figures of single stories", "ch": "42", "lead": "Father of both brothers.", "forms": [{"t": "The Father", "ch": "42", "x": "On the phone, on the line 25291791441265: “Your tail is a little far down your throat now, son,” and “you need to take the rest of the pills.” At the end: “He didn't listen. Yeah… We'll have to repeat it again.”"}], "notes": []}, {"id": "red", "name": "Red", "cat": "Figures of single stories", "ch": "39", "lead": "A crimson rose of a man.", "forms": [{"t": "Red", "ch": "39", "x": "Under two setting suns he chases Blue's rain with a golden chalice and drinks his own tears after she is carried away. “Why?”"}], "notes": []}, {"id": "blue", "name": "Blue", "cat": "Figures of single stories", "ch": "39", "lead": "A trumpet gentian of a woman.", "forms": [{"t": "Blue", "ch": "39", "x": "She glides with a mirage of rain until a breeze carries her off, leaving the smell of her rain in the soil."}], "notes": []}, {"id": "binah", "name": "The Euclids of Binah", "cat": "Figures of single stories", "ch": "16, 19", "lead": "The Southern tribe of Euclids.", "forms": [{"t": "The Euclids of Binah", "ch": "16, 19", "x": "They pour wax down their backs, lash themselves and starve; one practitioner is castrated, hairless and rune-burned. They keep soul-locked grunts with machine-hijacked brains (16). In a cave of forgotten machines, they set Antony into Samson's new heart (19)."}], "notes": []}, {"id": "tiph", "name": "The Euclids of Tiphareth", "cat": "Figures of single stories", "ch": "16", "lead": "The Northern tribe of Euclids.", "forms": [{"t": "The Euclids of Tiphareth", "ch": "16", "x": "Led by Kether, they seek visions through pleasure and bondage, synthesize new drugs, trade in taboo knowledge and humans, and fight like jackals and scorpions."}], "notes": []}];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const box=document.getElementById("entries"),idx=document.getElementById("index"),jump=document.getElementById("jump"),q=document.getElementById("q"),count=document.getElementById("count");
const sel={};
function formHtml(e,i){const f=e.forms[i];return `<div class="form" role="tabpanel" id="p-${e.id}" aria-labelledby="t-${e.id}-${i}"><h4>${esc(f.t)}<span>ch. ${esc(f.ch)}</span></h4><p>${esc(f.x)}</p></div>`}
function art(e){
  const i=sel[e.id]||0;
  const tabs=e.forms.length>1?`<div class="tabs" role="tablist" aria-label="Forms of ${esc(e.name)}">${e.forms.map((f,k)=>`<button type="button" role="tab" id="t-${e.id}-${k}" aria-controls="p-${e.id}" aria-selected="${k===i}" tabindex="${k===i?0:-1}" data-e="${e.id}" data-k="${k}">${esc(f.t)}</button>`).join("")}</div>`:"";
  return `<article id="${e.id}"><h3>${esc(e.name)}</h3><p class="meta">${esc(e.cat)} · ch. ${esc(e.ch)}${e.forms.length>1?` · ${e.forms.length} forms`:""}</p><p class="lead">${esc(e.lead)}</p>${tabs}${formHtml(e,i)}${e.notes.map(n=>`<p class="note">${esc(n)}</p>`).join("")}</article>`;
}
function matches(e,t){if(!t)return true;t=t.toLowerCase();return [e.name,e.lead,e.ch,...e.forms.map(f=>f.t+" "+f.x),...e.notes].join(" ").toLowerCase().includes(t)}
function render(){
  const t=q.value.trim();let n=0;
  box.innerHTML=CATS.map(c=>{const list=E.filter(e=>e.cat===c&&matches(e,t));n+=list.length;return list.length?`<section class="cat"><h2>${esc(c)}</h2>${list.map(art).join("")}</section>`:""}).join("")||`<p class="empty">Nothing in the codex matches “${esc(t)}”.</p>`;
  count.textContent=t?`${n} of ${E.length} entries`:`${E.length} entries`;
}
function wireTabs(){}
box.addEventListener("click",ev=>{const b=ev.target.closest("button[role=tab]");if(!b)return;sel[b.dataset.e]=+b.dataset.k;swap(b.dataset.e,true)});
box.addEventListener("keydown",ev=>{const b=ev.target.closest("button[role=tab]");if(!b||!["ArrowRight","ArrowLeft","Home","End"].includes(ev.key))return;ev.preventDefault();
  const e=E.find(x=>x.id===b.dataset.e),L=e.forms.length;let k=+b.dataset.k;
  k=ev.key==="ArrowRight"?(k+1)%L:ev.key==="ArrowLeft"?(k-1+L)%L:ev.key==="Home"?0:L-1;sel[e.id]=k;swap(e.id,true)});
function swap(id,focus){const a=document.getElementById(id);const e=E.find(x=>x.id===id);const k=sel[id]||0;
  a.querySelectorAll("button[role=tab]").forEach((b,j)=>{b.setAttribute("aria-selected",j===k);b.tabIndex=j===k?0:-1});
  a.querySelector(".form").outerHTML=formHtml(e,k);if(focus)a.querySelector(`#t-${id}-${k}`).focus()}
idx.innerHTML=CATS.map(c=>`<h2>${esc(c)}</h2><ul>${E.filter(e=>e.cat===c).map(e=>`<li><a href="#${e.id}" data-id="${e.id}">${esc(e.name)}</a></li>`).join("")}</ul>`).join("");
CATS.forEach(c=>{const g=document.createElement("optgroup");g.label=c;E.filter(e=>e.cat===c).forEach(e=>{const o=document.createElement("option");o.value=e.id;o.textContent=e.name;g.appendChild(o)});jump.appendChild(g)});
jump.addEventListener("change",()=>{if(!jump.value)return;if(q.value){q.value="";render()}location.hash=jump.value;document.getElementById(jump.value)?.scrollIntoView()});
idx.addEventListener("click",ev=>{const a=ev.target.closest("a");if(a&&q.value){q.value="";render()}});
q.addEventListener("input",render);
render();
const links=[...idx.querySelectorAll("a")];
const io=new IntersectionObserver(es=>{es.forEach(x=>{if(x.isIntersecting){links.forEach(a=>a.classList.toggle("cur",a.dataset.id===x.target.id))}})},{rootMargin:"0px 0px -70% 0px"});
function observe(){io.disconnect();box.querySelectorAll("article").forEach(a=>io.observe(a))}
observe();q.addEventListener("input",observe);
if(location.hash){const t=document.getElementById(location.hash.slice(1));t&&t.scrollIntoView()}
</script>
