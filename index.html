<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nous Within Kenoma</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Spectral:ital@0;1&display=swap">
<style>
:root{--ink:#0d0b15;--bone:#e7dcc6;--dim:#9d93a8;--gilt:#c9a45c;--rule:#3a3350;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 30%,#1d1930,var(--ink) 70%);color:var(--bone);font-family:"Spectral",Georgia,serif;display:grid;place-items:center;padding:40px max(16px,env(safe-area-inset-left,0px))}
main{max-width:560px;text-align:center}
h1{font-family:"IM Fell English SC",Georgia,serif;font-weight:400;color:var(--gilt);font-size:clamp(30px,6vw,46px);margin:0 0 6px}
p{color:var(--dim);font-style:italic;margin:0 0 28px}
nav{display:grid;gap:14px}
a{display:block;border:1px solid var(--rule);padding:16px 18px;color:var(--bone);text-decoration:none;font-size:18px;background:#1a1726}
a span{display:block;color:var(--dim);font-size:14px;margin-top:2px}
a:hover,a:focus-visible{border-color:var(--gilt);color:var(--gilt);outline:none}
</style>
</head>
<body>
<main>
  <h1>Nous Within Kenoma</h1>
  <p>Maps of the book by Bryce Staton</p>
  <nav>
    <a href="kenoma-character-web.html">Character Web<span>Every named figure and how they connect</span></a>
    <a href="kenoma-cosmos-map.html">The Cosmos<span>From the plane of the Earth to the outer darkness</span></a>
  </nav>
</main>
